# An EMPTY [workspace] makes this crate its own workspace root, so it builds standalone no matter where it
# is checked out — including nested inside ANOTHER cargo workspace (e.g. the runtime's differential-parity
# CI job, which checks the SDK out under the runtime tree). Without it, cargo adopts this crate into the
# enclosing workspace and refuses to build it ("believes it's in a workspace when it's not"). A verifier
# whose whole claim is "check it out and build it yourself, anywhere" must not depend on its parent dir.
[workspace]

[package]
name = "seam-verify"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Independently verify a Seam audit chain and an erasure certificate. Links nothing of Seam's."
repository = "https://github.com/zer07labs/seam-sdk"
readme = "README.md"
keywords = ["audit", "verification", "ed25519", "hash-chain", "gdpr"]
categories = ["command-line-utilities", "cryptography"]

# MSRV. There was NONE before publishing was contemplated, and crates.io would have accepted that
# silently: a published crate with no `rust-version` gives a consumer no signal at all, and they find
# out from a compile error instead.
#
# DERIVED, not chosen — the same discipline `python/pyproject.toml`'s protobuf floor follows, and for
# the same reason. It is the maximum `rust-version` declared anywhere in the resolved dependency
# graph: 1.85, from `prost` 0.14.4 / `base64ct` 1.8.3 / `zeroize` 1.9.0 (`ed25519-dalek` 2.2.0 wants
# only 1.81). A guessed floor here is worse than none, because it reads as a checked promise.
#
# The dependencies move on their own schedule, so this number moves too. `tests/msrv.rs` derives it
# from `cargo metadata` and fails when a dependency outruns it — which keeps the two in step without
# anyone remembering to look.
rust-version = "1.85"

# PUBLISHED to crates.io, deliberately, and this is the one irreversible decision in the crate.
#
# `seam-runtime/crates/seam-verify` is named `seam-verify` too, and crates.io has ONE namespace —
# the first publish claims the name permanently. This is the copy that goes out, because it is the
# one that can: public repo, Apache-2.0, its own standalone workspace, and ZERO Seam dependencies
# (a CI gate, not a comment — ci.yml runs `cargo tree -e normal` and fails on any `seam-*`).
#
# The runtime's copy must NOT be published: it links `seam-store` and `seam-trust-aitp`, which
# inverts the claim its own comment defends. It is the differential ORACLE — the second
# implementation the parity harness drives over the same streams so neither side becomes a rubber
# stamp — and that role needs it internal. Rename tracked at zer07labs/seam-runtime#419; nothing
# here publishes until that closes.
publish = true

# ==================================================================================================
# THE DEPENDENCY LIST IS THE ARGUMENT.
#
# Seam's claim is: "don't trust us — verify it yourself." A verifier that links Seam's own store, its
# server, or its types is not a verifier; it is Seam checking Seam, which is exactly what the claim says
# you should not have to accept.
#
# So this crate depends on NOTHING of Seam's. Not one crate, not one type, not one line. It is built from
# the published specs alone:
#
#   * docs/seam-event.v1.md          — the wire format and the chain rule
#   * docs/erasure-certificate.v1.md — the signing framing
#
# Everything below is a general-purpose primitive you can audit yourself:
#
#   prost          decode protobuf
#   sha2           SHA-256 (the chain link, and the certificate's signed digest)
#   ed25519-dalek  verify the issuer's signature
#   base64         the AID's key encoding, and the JSON projection's bytes fields
#   serde_json     the JSON projection
#
# `cargo tree` is the assertion. If a Seam crate ever appears in it, the claim has quietly stopped being
# true — and that is a review trigger, not a refactor.
#
# There IS a second implementation of this inside the runtime (`seam-runtime/crates/seam-verify`), which
# reuses the runtime's own codec because it can. A differential test drives BOTH over the same streams and
# requires them to agree. That is what stops this copy from drifting into a rubber stamp.
# ==================================================================================================
[dependencies]
prost = "0.14"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only. The fixtures are built from the SPEC (a SHA-256 chain, a base64 projection) — which is itself
# the proof that a third party can build them too, with nothing of Seam's.
[dev-dependencies]
sha2 = "0.10"
base64 = "0.22"
# tests/msrv.rs parses `cargo metadata` to derive the real MSRV from the resolved graph.
serde_json = "1"

[[bin]]
name = "seam-verify"
path = "src/main.rs"
