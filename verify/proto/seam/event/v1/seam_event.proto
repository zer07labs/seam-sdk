// THE canonical `seam-event.v1` wire schema — the outbox contract.
//
// This is the schema an external consumer decodes, and the one a third party needs in order to verify
// Seam's audit chain without trusting Seam. The normative prose is `docs/seam-event.v1.md`, alongside;
// the reference verifier that reads these bytes is this crate.
//
// RULES FOR CHANGING THIS FILE:
//   * Tags are the wire contract. Never renumber, never reuse, never retype.
//   * Additive-only within v1: a new field takes the next free tag and MUST be `optional` or `repeated`,
//     so existing encoders produce byte-identical output when it is absent.
//   * A breaking change is not a change here — it is `seam-event.v2` plus a dual-emit window
//     (spec §Versioning).
//
// Presence mapping (why some fields are `optional` and others are not):
//   proto3 `optional string`  -> explicit presence
//   proto3 `string`           -> implicit presence (no tag emitted for the default value)
//   message field             -> presence is native
//   `repeated double`         -> packed, the proto3 default
// Getting this wrong changes the bytes on the wire.

syntax = "proto3";

package seam.event.v1;

option go_package = "github.com/zer07labs/seam-sdk/gen/seam/event/v1;eventv1";
option java_multiple_files = true;
option java_package = "com.zer07labs.seam.event.v1";

// The `seam-event.v1` envelope — one outbox row.
//
// Exactly one payload field is set, selected by `kind`:
//   DECISION_SEALED        -> payload                 (tag 13, CHAINED)
//   LEARNING_DECISION      -> learning_decision       (tag 14, advisory/unchained)
//   LEARNING_OUTCOME       -> learning_outcome        (tag 15, advisory/unchained)
//   AUDIT_ENTRY            -> audit_entry              (tag 16, CHAINED)
//   BUDGET_BREACH          -> budget_breach            (tag 17, advisory/unchained)
//   ERASURE_CERTIFICATE    -> erasure_certificate      (tag 18, CHAINED, signed)
//   SESSION_LIFECYCLE      -> session_lifecycle        (tag 21, advisory/unchained; CP-09)
//   CHAIN_HEAD_ATTESTATION -> chain_head_attestation   (tag 22, CHAINED, signed; A14)
//   AUTHORIZE_EVALUATED    -> authorize_evaluated      (tag 23, advisory/unchained)
//
// SESSION_LIFECYCLE (CP-09) was revived at its long-reserved tag 21 WITH its producer (the runtime emits
// `phase: "opened"` on interactive opens); it is advisory (carries no digest/checksum) and this verifier
// treats it as such (by field presence, not kind). CHAIN_HEAD_ATTESTATION (A14) is the issuer-signed
// `(len, head)` at tag 22 — itself CHAINED, and additionally verified under `seam-verify chain --issuer`.
// See DECISIONS.md D-002 (tag 21 reservation).
message SeamEvent {
  // Always "seam-event.v1". A consumer that sees anything else DLQs the event tagged
  // `unknown-schema` — it never crashes and never guesses.
  string schema_version = 1;

  // Unique + stable per event. THE idempotency key: every sink write is idempotent by this, or
  // dedups on it before the sink.
  string event_id = 2;

  // Monotonic over the runtime's single ordered outbox. The ordering key, and the unit `replay_from`
  // rewinds to.
  uint64 seq = 3;

  // Millis. Injected at emit — never a wall-clock read on the binding path.
  uint64 occurred_at = 4;

  string tenant = 5;
  string namespace = 6;

  // The classification label driving per-consumer redaction. Vocabulary (ascending sensitivity):
  // Public < Internal < Confidential < Financial < Pii < Phi. An unknown label is fail-closed
  // everywhere (a manifest naming one is refused; an event carrying one is DLQ'd, never passed on).
  string classification = 7;

  // The kind discriminator. A *string*, not an enum, precisely so an unknown kind decodes cleanly
  // and is ignored rather than erroring (tolerant reader, spec §Versioning).
  string kind = 8;

  optional string session_id = 9;
  optional string decision_id = 10;

  // Per-event cost signal (R11 — observability, never a record field).
  uint64 cost_micros = 11;

  // The hash-chain link. Set on the CHAINED kinds (DECISION_SEALED, AUDIT_ENTRY,
  // ERASURE_CERTIFICATE); EMPTY on the advisory kinds (LEARNING_*, BUDGET_BREACH).
  //
  // The chain is global over the *unfiltered* stream. A kind-filtered subscription therefore gets
  // at-least-once + dedup but NOT the completeness proof — which is why every SDK refuses
  // `verify_chain` on a filtered subscription rather than silently reporting a false gap.
  bytes prev_checksum = 12;

  // The DECISION_SEALED payload — structural columns only, never the encrypted commitment
  // plaintext. The stream never carries openable secrets.
  //
  // Message-typed fields are NOT marked `optional`: in proto3 they already carry explicit presence
  // natively (`optional` would only wrap them in a redundant synthetic oneof). This mirrors prost's
  // `Option<Message>` exactly. The scalar `optional`s above (tags 9/10) DO need the keyword.
  DecisionSealed payload = 13;

  LearningDecision learning_decision = 14;
  LearningOutcome learning_outcome = 15;
  AuditEntry audit_entry = 16;
  BudgetBreach budget_breach = 17;
  ErasureCertificate erasure_certificate = 18;

  // ── 19/20: the chain-verifiability fix, now SHIPPED (docs/upstream/UPSTREAM-001) ──
  //
  // The chain link is `checksum = H(prev || digest)` over the sealed-record digest. Previously the digest
  // was NOT on the wire, so a consumer held `prev_checksum` and could never recompute a single link, and
  // every SDK's `verify_chain` shipped the weaker, honest check (seq contiguity + genesis + non-reverting
  // head). These two additive fields carry this entry's own digest and resulting checksum, so a consumer
  // now verifies the full chain from the stream alone: for each chained event in seq order, assert
  // `prev_checksum == running_head` and `checksum == H(prev_checksum || digest)`, then advance the head.
  //
  // Set on the CHAINED kinds ONLY (DECISION_SEALED / AUDIT_ENTRY / ERASURE_CERTIFICATE); absent on the
  // advisory kinds (as `prev_checksum` is empty for them). Purely additive — an encoder that omits them
  // produces byte-identical output, so no lockstep upgrade.
  //
  // NOTE: events written BEFORE these fields were added carry neither, and are therefore indistinguishable
  // from advisory (unchained) events to a verifier reading bytes. See the spec's warning — a verifier MUST
  // disclose how many such events it skipped, or refuse the stream. Reporting a green chain over history
  // it never checked is the one thing it must not do.
  optional bytes digest = 19;    // this entry's record/action digest
  optional bytes checksum = 20;  // = H(prev_checksum || digest); the head this entry produces

  // ── 21/22: the CP-09 revival + A14 authenticity root ──
  //
  // 21 — SESSION_LIFECYCLE (advisory, unchained): a session transition ("opened" today). Carries no
  // digest/checksum; a verifier keys chained-ness on field presence, so this never advances the head.
  // 22 — CHAIN_HEAD_ATTESTATION (CHAINED, signed): the issuer-signed audit-chain `(len, head)`. It IS a
  // link (carries digest/checksum) AND is separately verified under `--issuer` — every attestation must
  // check against the pinned issuer key and sit at the head it attests, closing the fabricated-chain gap
  // (an unkeyed SHA-256 chain over a public genesis is otherwise rebuildable by a transport-level forger).
  optional SessionLifecycle session_lifecycle = 21;
  optional ChainHeadAttestation chain_head_attestation = 22;

  // ── 23: the advisory AUTHORIZE_EVALUATED payload ──
  //
  // One row per `SeamAuthorization.Authorize` evaluation (spec §AUTHORIZE_EVALUATED). ADVISORY,
  // unchained: the authorize path seals nothing — no decision record, no DEK, no chain append — so the
  // event carries no digest/checksum and an empty prev_checksum, and never advances the head. Additive:
  // absent on every other kind, so existing events' bytes are unchanged.
  optional AuthorizeEvaluated authorize_evaluated = 23;
}

// AUTHORIZE_EVALUATED payload (envelope tag 23) — ADVISORY, unchained. The audit row for one advisory
// authorization; `authorize_id` (a ULID) is its handle, never a `decision_id` (nothing was sealed).
//
// PII rule: the end-user data subject rides ONLY as `subject_digest = sha256(subject)`, never raw — an
// outbox row is un-shredable, so a raw end-user id here would be an un-erasable copy of it.
message AuthorizeEvaluated {
  string authorize_id = 1;                // ULID — the handle returned to the caller
  optional string client_request_id = 2;  // the caller's idempotent audit-join key, when supplied
  string agent_aid = 3;                   // the VERIFIED caller AID (derived, never asserted)
  string agent_id = 4;                    // the registry identity the scope floor was evaluated against
  string tool_name = 5;
  string tool_input_digest = 6;           // "sha256:<hex>" over the RFC 8785 (JCS) canonical input
  string verdict = 7;                     // "ALLOW" | "DENY" | "TRANSFORM" | "ESCALATE"
  string reason = 8;                      // closed-set / operator-authored only (D-030)
  string policy_version = 9;
  optional string subject_digest = 10;    // sha256(subject) hex — NEVER the raw subject
}

// SESSION_LIFECYCLE payload (envelope tag 21) — ADVISORY, unchained (CP-09). Operational metadata only:
// no subject, secret, or agent content. Consumers MUST tolerate unknown `phase` values (additive vocab).
message SessionLifecycle {
  string phase = 1;           // "opened" today
  string mode = 2;
  string policy_version = 3;
  uint64 opened_at_millis = 4;
}

// CHAIN_HEAD_ATTESTATION payload (envelope tag 22) — CHAINED and SIGNED (A14).
//
// Ed25519 over SHA256 of the domain-separated `seam.audit.chain-head-attestation.v1` framing, by the
// runtime ISSUER key (the same key as the TCT + erasure cert). `seam-verify chain --issuer <AID>` verifies
// every attestation against the PINNED issuer AID and asserts `attested_head` is the running head after
// `attested_len` links; a stream carrying none is refused.
message ChainHeadAttestation {
  uint64 attested_len = 1;    // 1-based head position = number of chained links covered
  bytes attested_head = 2;    // the checksum at position attested_len (32 bytes)
  uint64 attested_at = 3;
  string issuer_aid = 4;
  // CEILING, not a description, and it selects nothing (spec §Chain-head attestation). Since B3 a
  // chain is mixed — v2 and v3 records interleave — so no scalar can name "the" formula in use.
  // This asserts every record in the attested prefix has `schema_version <= digest_schema`, which
  // is why old attestations stay true and are never re-signed: a ceiling only rises.
  // A verifier MUST NOT read it to choose a formula; src/verify.rs dispatches per record on the
  // record's own `schema_version`. Its job is about the SIGNED artifact — an attestation goes to an
  // external notary, so stamping v3 while signing `digest_schema = 2` would issue, under the issuer
  // key, exactly the downgrade claim this field exists to prevent.
  uint32 digest_schema = 5;   // 2 = A14 v2, 3 = B3 v3; bound into the signature (downgrade guard)
  bytes signature = 6;
}

// DECISION_SEALED payload (envelope tag 13). Structural columns of the DecisionRecord.
message DecisionSealed {
  string decision_id = 1;
  string tenant = 2;
  string namespace = 3;
  optional string mode = 4;
  optional string policy_version = 5;
  string outcome = 6;
  optional string supersedes = 7;
  uint64 sealed_at = 8;
  uint32 schema_version = 9;
  // tag 10 (A14) — SHA256(ciphertext). MANDATORY on v2 (schema_version >= 2), absent on v1. The one input
  // to the record digest a stream consumer does not otherwise hold: with it, a consumer recomputes
  // digest-v2 (§Record digest) and compares to `digest` (tag 19) to catch a payload rewrite. A v2 record
  // missing it is a strip/downgrade — `seam-verify chain --issuer` REFUSES it.
  bytes ciphertext_digest = 10;
  // tags 11/12/13 (B3) — the three columns carrying the decision's actual claims, each a 32-byte
  // sub-digest. They are OPAQUE to a consumer: the record-digest v3 formula takes them as inputs and
  // never re-derives them, so recomputation needs no access to the context or participation data
  // itself (which is the point — `participation[].subject` is the GDPR erasure predicate, and
  // publishing subjects on an append-only outbox would make erasure unenforceable at the sink).
  //
  // These are SINGULAR, not `optional`, and this copy said the opposite until seam-runtime#435 settled
  // it. The argument for `optional` — that presence is what separates "no participants" from "field
  // deleted" — was put to the runtime and REJECTED, for a better reason than the one it proposed: a
  // digest slot's value domain is {absent} ∪ {exactly 32 bytes}, and a singular field makes the
  // out-of-domain empty value UNREPRESENTABLE by a conforming encoder, because proto3 emits no bytes
  // for a singular scalar at its default. Declaring these `optional` would make `Some(b"")` encodable
  // and meaningless — and a representable-but-meaningless value is one some implementation eventually
  // produces. Absent vs present is still what drives the refusal; it is just carried by LENGTH.
  //
  // The consumer rule (spec §"Presence on the wire") is therefore a TOTAL mapping: on tags 10-13,
  // `len == 0` means absent however the bytes arose — including an explicitly-encoded zero-length
  // field, which proto3 obliges a decoder to accept even though a conforming producer never emits one.
  // Tags 11/12 absent on schema_version = 3 is a strip and is REFUSED — never defaulted to an empty
  // digest, never recomputed under the v2 formula. Tag 13 absent is legitimate and frames as opt(None).
  //
  // Tags 4/5/7 above are the genuine `optional` case, and the contrast is the whole rule: the empty
  // string IS in their value domain, so `None` and `Some("")` are two preimages the wire must keep
  // apart. The digest slots have no such second state to track.
  //
  // Flipping any of these to `optional` is a SEMANTIC break even though `buf breaking`'s WIRE_JSON
  // ruleset permits it: afterwards a zero-length tag 13 frames as opt(None) for a consumer testing
  // length and opt(Some(b"")) for one testing generated presence, and the two recompute different
  // digests from identical bytes.
  bytes context_digest = 11;        // MANDATORY on v3 — what context the decision consumed
  bytes participation_digest = 12;  // MANDATORY on v3 — who participated
  bytes policy_rules_digest = 13;   // OPTIONAL — absent (len == 0) means no policy was bound
}

// The posterior-keying tuple, shared verbatim with the seam-learning engine so the runtime and the
// engine agree on the arm key without a re-map (`docs/specs/learning-keys.md`).
message PolicyKey {
  string tenant = 1;
  string task_type = 2;
  string context_class = 3;
  string mode = 4;
}

// LEARNING_DECISION payload (envelope tag 14) — ADVISORY, unchained, no binding authority.
// One event per decision *dimension*, joined to outcomes by the ENVELOPE `decision_id`.
message LearningDecision {
  PolicyKey policy_key = 1;

  // "policy" | "agent" — which decision dimension this arm is for.
  string dimension = 2;

  string algorithm_id = 3;

  // The chosen arm.
  string candidate = 4;

  optional string experiment_id = 5;
  optional string algorithm_arm = 6;

  // The served feature vector `x` — the EXACT one the serving read used, so serve==fit parity holds
  // by construction. Empty for non-contextual algorithms (Thompson).
  repeated double features = 7;

  // The FeatureSchema id `x` was encoded under. Absent for Thompson.
  optional string schema_id = 8;

  // P(this arm | x) at serve time — required for retroactive off-policy evaluation (IPS/SNIPS/DR).
  // Absent until the serving read populates it. Once real traffic flows an unlogged propensity is
  // UNRECOVERABLE, which is why the slot is fixed now (plan 02 §E). The ingestion connector maps it
  // when present and writes NULL when absent; it can never synthesize it.
  optional double propensity = 9;
}

// LEARNING_OUTCOME payload (envelope tag 15) — ADVISORY, unchained.
//
// Repeated outcomes for one decision are DISTINCT events by construction (the runtime folds the
// report time and seq into the event_id: `{decision_id}#lo#{occurred_at}#{seq}`) — a correction or a
// second reporter is a new event, never a mutation. The offline join decides which one wins.
message LearningOutcome {
  bool correct = 1;
  optional string verified_by = 2;
}

// AUDIT_ENTRY payload (envelope tag 16) — CHAINED. An audit event for actions that produce no
// DecisionRecord: nothing was decided, but the refusal itself must be provable.
message AuditEntry {
  // Machine-readable action discriminator, e.g. "admit.compat_reject" | "execute.scope_deny".
  string action = 1;
  // The subject acted on (e.g. the offending agent_id).
  string subject = 2;
  // The rendered typed denial. No secrets, no free-text agent content — which is why SIEM
  // destinations may pass it through unredacted.
  string reason = 3;
  // rt-D §4 — the authenticated operator subject that performed a management action; absent on the
  // unauthenticated dev-open plane. A FRESH optional tag: a decoder that never saw it reads absent
  // (back-compat) and a pre-migration entry re-encodes byte-identically.
  optional string actor = 4;
}

// BUDGET_BREACH payload (envelope tag 17) — ADVISORY, unchained.
//
// severity "hard" means the session is now SUSPENDED awaiting an approver, so alert latency on this
// kind is user-facing, not merely operational.
message BudgetBreach {
  // "hard" (suspended, awaiting HITL) | "soft" (early warning).
  string severity = 1;
  // The breached dimension: "messages" | "tokens" | "cost_micros" | "wall_ms".
  string dimension = 2;
  // The limit on the breached dimension.
  uint64 limit = 3;
  // The full ledger snapshot at the breach, so an approver sees exactly what was spent against what.
  uint64 messages = 4;
  uint64 tokens = 5;
  uint64 cost_micros = 6;
  uint64 wall_ms = 7;
}

// ERASURE_CERTIFICATE payload (envelope tag 18) — CHAINED and SIGNED.
//
// Ed25519 over the domain-separated `seam.erasure-certificate.v1` framing, by the runtime ISSUER
// key. A data subject or regulator verifies it from the published issuer AID alone. No connector
// ever holds or references that key (custody separation — plan 04 §5.4).
message ErasureCertificate {
  string subject = 1;
  // Decision ids whose keys are destroyed.
  repeated string erased = 2;
  // Decision ids withheld under legal hold — disclosed, never silent.
  repeated string held = 3;
  uint64 erased_at = 4;
  // The audit-chain head at certification.
  bytes chain_head = 5;
  string issuer_aid = 6;
  bytes signature = 7;
}
