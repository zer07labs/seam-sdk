// seam.event.v1 — the CANONICAL seam-event.v1 wire schema.
//
// This is the single source of truth for the seam-event.v1 outbox/relay event format: every message and
// field tag here is byte-identical to the hand-written `seam_store::event::canonical::SeamEventPb` (the
// encoder `SeamEvent::to_bytes` emits, and the raw outbox + gRPC `StreamEvents` carry). It was extracted
// out of `seam.api.v1` so consumers that want ONLY the event schema (e.g. seam-learning's protobuf codec)
// can generate from it without pulling the whole transport contract; `seam.api.v1` now IMPORTS this file
// and reuses `SeamEvent` (for `StreamEvents`), `ErasureCertificate` (for `SeamAdmin.EraseSubject`) and
// `ChainHeadAttestation` (for `SeamTrust.VerifyPartyAttestation`).
//
// WIRE CONTRACT: the field tags are load-bearing (the audit hash-chain digests, the SDK verifiers, and the
// learning codec all decode by tag). Tags are frozen; `docs/specs/seam-event.v1.md` is the prose spec and
// `crates/seam-store/tests/pb_byte_golden.rs` is the byte oracle. A tag renumber is a breaking wire change.
//
// CONVENTIONS (R4 — keep this file, the hand-written `seam_store::event::canonical::SeamEventPb`, and the
// seam-connectors contract copy convergent):
//   - `optional` is used ONLY on scalar fields (string/bytes/double, and `tenant_seq` uint64 — 0 is a valid
//     value there and absence means "predates the counter") that need presence. MESSAGE-typed
//     fields are ALWAYS presence-tracked in proto3 (prost emits `Option<M>` regardless), so `optional` on a
//     message field is redundant and is NOT written here.
//   - `DecisionSealed` cardinality is DERIVED, not stylistic: a scalar is `optional` iff its
//     record-digest slot is `opt(...)` AND the empty value is inside its value domain (tags 4/5/7 —
//     absence and `""` are different preimages, so they must not alias on the wire). Everything else is
//     singular — in particular the four digest slots (tags 10-13), whose domain is {absent} u
//     {32 bytes}: singular makes present-but-empty UNREPRESENTABLE by a conforming encoder (proto3
//     emits no bytes for a singular scalar at its default), and `len == 0` is then DEFINED to mean
//     absent (spec, "Presence on the wire"). Flipping one to `optional` is wire-compatible (this repo's
//     `buf.yaml` runs WIRE_JSON, which permits it) but SEMANTICALLY BREAKING: a zero-length tag would
//     frame as `opt(None)` to a consumer testing emptiness and `opt(Some(b""))` to one testing
//     generated presence — two digests from identical bytes. Per-tag cardinality is pinned in
//     `fixtures/seam_event_descriptor.json` so the flip cannot be quiet. The rule is DecisionSealed's,
//     not the package's: `SeamEvent` declares `digest`/`checksum` (19/20) `optional` yet
//     `prev_checksum` (12) singular (empty there is itself a value — "not chained"); the spec section
//     gives the local reasons.
//   - Message type names are canonical HERE (this package owns seam.event.v1). The tag→field mapping is
//     pinned against the hand-written `SeamEventPb` by `seam-store`'s `event_schema_matches_hand_written_pb`
//     drift guard; a divergent consumer copy (e.g. connectors' `AuditEntry` vs this `AuditEntryEvent`) must
//     converge to these names.
syntax = "proto3";

package seam.event.v1;

// The DECISION_SEALED payload. Tags mirror `seam-event.v1` `DecisionSealedPb` exactly.
message DecisionSealed {
  string decision_id = 1;
  string tenant = 2;
  string namespace = 3;
  optional string mode = 4;
  // The policy the binding named, as governance STAGED it — NOT "ran under". A populated value is
  // not on its own evidence that the named policy's rules evaluated this commitment: a namespace
  // governed to an id the loaded registry does not carry seals fail-open with this field set and
  // nothing bound. For what actually bound, read `policy_rules_digest` (tag 13) on this same
  // message. Mirrors the identically named field on `seam.api.v1.DecisionResponse` (#561).
  optional string policy_version = 5;
  string outcome = 6;
  optional string supersedes = 7;
  uint64 sealed_at = 8;
  uint32 schema_version = 9;
  // `SHA256(ciphertext)` — the one record-digest input a stream consumer does not otherwise hold.
  // MANDATORY (`schema_version == 4`, the only version); a payload missing it is a strip and a strict
  // verifier REFUSES it. Mirrors `DecisionSealedPb.ciphertext_digest` (tag 10).
  bytes ciphertext_digest = 10;
  // The two rolled-up sub-digests the v4 record digest frames, published so a stream consumer recomputes
  // the digest from the wire alone. Rolled up rather than carrying the lists themselves:
  // `participation[].subject` is the GDPR erasure predicate and must never leave the runtime on the
  // outbox (spec §9 item 4). Both MANDATORY; a payload missing either is a strip attack and a strict
  // verifier REFUSES it — reported distinctly from a digest mismatch. Mirror `DecisionSealedPb` tags 11/12.
  bytes context_digest = 11;
  bytes participation_digest = 12;
  // `SHA256(JCS(policy_definition))` of the policy actually bound to the session. Genuinely OPTIONAL:
  // absent means no policy was bound, so absence here is NOT a strip signal. A stripped tag 13 still
  // fails closed — the recomputed digest simply won't match, since the preimage `opt`s this slot and
  // `None` ≠ `Some(..)`. Mirrors `DecisionSealedPb.policy_rules_digest`.
  // Declared singular, not `optional`, per the cardinality rule above: a consumer reads `len == 0` as
  // `opt(None)`, and a present-but-empty digest is not a state a conforming producer can encode.
  bytes policy_rules_digest = 13;
  // §P7 (v4) — the record's data classification (`Classification` name, e.g. `Financial`), framed into
  // the v4 record digest. MANDATORY; empty is a strip. Mirrors `DecisionSealedPb.classification` (14).
  string classification = 14;
  // §P7 (v4) — `SHA256(frame("seam.audit.participants.v4") ‖ le32 n ‖ frame(id)…)` over the sealed
  // `participants`, in stored order. Rolled up: participant ids never leave the runtime on the outbox.
  // MANDATORY (an empty roster still has a digest, n = 0). Mirrors `DecisionSealedPb.participants_digest`.
  bytes participants_digest = 15;
  // §P7 (v4) — the keyed trust-basis commitment, `hmac-sha256:<kid>:<hex>`, exactly as stored. Opaque:
  // a consumer frames it, never re-derives it (the key is tenant-scoped and shreddable). MANDATORY.
  // Mirrors `DecisionSealedPb.trust_basis_commitment` (tag 16).
  string trust_basis_commitment = 16;
  // §P7 (v4) — the closed-vocabulary authentication method (`aitp-pinned-handshake`, `aitp-tct`,
  // `aitp-pinned`, or the sentinel `none`). MANDATORY. Mirrors `DecisionSealedPb.auth_method` (tag 17).
  string auth_method = 17;
}

// A governance event. Tags mirror the canonical `seam-event.v1` `SeamEventPb` wire form EXACTLY so an
// existing connector decodes either identically. At most one payload field (tags 13–18, 21–24, 26) is set,
// keyed by `kind`; the rest are absent.
message SeamEvent {
  string schema_version = 1;
  string event_id = 2;
  uint64 seq = 3;
  uint64 occurred_at = 4;
  string tenant = 5;
  string namespace = 6;
  string classification = 7;
  string kind = 8;
  optional string session_id = 9;
  optional string decision_id = 10;
  uint64 cost_micros = 11;
  bytes prev_checksum = 12;
  DecisionSealed payload = 13;
  // Additive governance/advisory payloads (tags 14–18), mirroring the canonical wire form so a
  // gRPC stream consumer decodes the same bodies an HTTP `GET /v1/events` consumer sees.
  LearningDecision learning_decision = 14;
  LearningOutcome learning_outcome = 15;
  AuditEntryEvent audit_entry = 16;
  BudgetBreach budget_breach = 17;
  ErasureCertificate erasure_certificate = 18;
  // §A — the chain-verification fields, mirroring the canonical wire (tags 19/20). Present on the CHAINED
  // kinds only (DECISION_SEALED / AUDIT_ENTRY / ERASURE_CERTIFICATE), so a gRPC `StreamEvents` consumer can
  // recompute `checksum == H(prev_checksum ‖ digest)` from the stream alone — same guarantee the HTTP
  // `GET /v1/events` and raw-outbox consumers get. (Must stay in lockstep with the canonical form: a gRPC
  // consumer that only saw `prev_checksum` would be back in the pre-§A unverifiable state.)
  optional bytes digest = 19;
  optional bytes checksum = 20;
  // CP-09 (tag 21) — the advisory SESSION_LIFECYCLE payload. A14 (tag 22) — the signed
  // CHAIN_HEAD_ATTESTATION (a CHAINED kind; carries digest/checksum above). Both mirror the canonical
  // `SeamEventPb` so a gRPC `StreamEvents` consumer decodes the same bodies the raw outbox emits.
  SessionLifecycle session_lifecycle = 21;
  ChainHeadAttestation chain_head_attestation = 22;
  // The advisory AUTHORIZE_EVALUATED payload (tag 23) — one row per `SeamAuthorization.Authorize`
  // evaluation. Additive: absent on every other kind, so existing events' bytes are unchanged.
  AuthorizeEvaluated authorize_evaluated = 23;
  // The advisory POLICY_DENIED payload (tag 24) — one row per commitment a bound policy REFUSED.
  // Additive: absent on every other kind, so existing events' bytes are unchanged.
  PolicyDenied policy_denied = 24;
  // Per-tenant outbox counter (#973): gap-free per `tenant`, starting at 0, counting EVERY event of that tenant
  // (chained and advisory). `optional` because 0 is a valid value and absence means "this event predates the
  // counter": singular would alias them. Additive: absent on every event written before the producer change, so
  // existing events' bytes — and every digest — are unchanged. UNSEALED: in no digest, checksum or signature, so
  // it detects loss/duplication in the stream, not adversarial suppression (see CHAIN_HEAD_ATTESTATION). NOT the
  // audit chain's `audit_entry.tenant_seq` (chained entries only) nor `GET /v1/audit` `chain_index`.
  optional uint64 tenant_seq = 25;
  // The advisory EVENT_REDRIVEN wrapper (tag 26, #1176) — an operator re-drove an existing outbox event
  // by reference (`SeamEvents.RedriveEvents`). Additive: absent on every other kind, so existing events'
  // bytes are unchanged.
  EventRedriven event_redriven = 26;
  // k8s P7 — the delivery stream (one per cell; today exactly one per deployment) this event was appended to:
  // a lowercase DNS label of at most 32 chars, the producer's `SEAM_STREAM_ID`. `seq` is monotonic and
  // gap-free WITHIN a stream_id, and `event_id` starts with `{stream_id}/`. MANDATORY on every event a
  // producer at or above this field writes; absent only on events written before it (the history boundary).
  // UNSEALED like `tenant_seq` (tag 25): in no digest, checksum or signature. A relay binds to one stream
  // by `StreamEventsRequest.stream_id`, which is where a wrong-cell relay is refused.
  string stream_id = 27;
}

// EVENT_REDRIVEN payload (advisory, UNCHAINED, tag 26; #1176) — DLQ retry option C. An operator named an
// existing outbox event by its coordinates and the runtime re-emitted it: `event` is that outbox row's
// seam-event.v1 bytes VERBATIM, read from the runtime's own outbox — never bytes a caller supplied, and
// never re-encoded, so every digest/checksum/signature inside still verifies.
//
// A WRAPPER, not a re-append of the original row: a verbatim copy at a fresh offset would carry a `seq`
// and (for a chained kind) a `prev_checksum` that no longer fit the stream, and a chain-verifying reader
// would read it as a replay. The envelope therefore has its own fresh `seq`/`tenant_seq`/`event_id`
// (`{original_event_id}#rd#{seq}`), copies the original's tenant/namespace/classification/session_id/
// decision_id, and carries no chain fields. A consumer (the relay) that re-delivers the inner event
// dedups on ITS `event_id`, so re-driving twice is harmless downstream.
//
// The three scalar fields copy what is inside `event` so a router can act without decoding it; a consumer
// that needs certainty decodes `event`. Mirrors `EventRedrivenPb`.
message EventRedriven {
  bytes event = 1;               // the original outbox row, verbatim seam-event.v1 protobuf
  string original_event_id = 2;  // the inner event's event_id (the consumers' dedup key)
  uint64 original_seq = 3;       // the inner event's global outbox seq (a DLQ letter's `seq` header)
  string original_kind = 4;      // the inner event's kind
}

// AUTHORIZE_EVALUATED payload (advisory, tag 23) — the audit row for one advisory authorization. Nothing
// was sealed, so this event is the ONLY trace of the call; `authorize_id` is its handle (never a
// `decision_id`). Mirrors `AuthorizeEvaluatedPb`.
//
// PII rule: the end-user data subject rides ONLY as `subject_digest`, never raw. An outbox row is
// un-shredable (GDPR erasure walks decision *records*), so a raw end-user id here would be an
// un-erasable copy. Since #484 both digest fields are KEYED COMMITMENTS —
// `hmac-sha256:<kid>:<hex>` over `put(domain) ‖ put(tenant) ‖ put(value)` — not bare hashes: an
// end-user id has a small enumerable preimage space, so a bare `sha256(subject)` let anyone holding
// the row confirm a guess at the identifier. Commitments stay correlation-preserving WITHIN one
// `<kid>`, so joins and dedup are unchanged; but recompute is no longer unilateral — it needs the
// deployment key, so an operator with the key can still correlate and a row-holder cannot. An in-band
// operator recompute facility is specified and is NOT built. Rows written before the cutover keep the
// old bare hashes, are never backfilled, remain brute-forceable, and DO NOT join to rows written
// after it. Where the issuer seed is public (SEAM_DEV_INSECURE) the derived key is public too and
// these fields conceal nothing. See docs/specs/seam-event.v1.md.
message AuthorizeEvaluated {
  string authorize_id = 1;                // ULID
  optional string client_request_id = 2;  // the caller's idempotent audit-join key, when supplied
  string agent_aid = 3;                   // the VERIFIED caller AID (derived, never asserted)
  string agent_id = 4;                    // audit-only LABEL, never the scope-floor key (see agent_aid)
  string tool_name = 5;
  string tool_input_digest = 6;           // "hmac-sha256:<kid>:<hex>" — a KEYED commitment, NOT
                                          // the request digest and never equal to it
  string verdict = 7;                     // "ALLOW" | "DENY" | "TRANSFORM" | "ESCALATE" (closed set)
  string reason = 8;                      // closed-set / operator-authored only (D-030)
  // The policy the binding named — STAGED, not "ran under". The authorize path produces no
  // enforcement fact at all by design (it seals nothing), so there is no companion attestation
  // here and a populated value proves only that a policy was routed and recorded (#561, #600).
  string policy_version = 9;
  optional string subject_digest = 10;    // "hmac-sha256:<kid>:<hex>" — NEVER the raw subject
  // One keyed commitment PER effective subject (#715): the union of AuthorizeRequest.subject and
  // .subjects, deduped, in request order, at most 16. Each element is the SAME commitment as
  // `subject_digest` ("hmac-sha256:<kid>:<hex>", same key and kid), so it is no weaker than tag 10: unlinkable to a
  // subject without the deployment key (rotating the key severs every join), no bare-hash oracle. `subject_digest` (10) stays populated with the FIRST
  // element for legacy consumers. Empty on rows written before this field existed — absent from the
  // canonical JSON when empty.
  repeated string subject_digests = 11;
}

// The POLICY_DENIED payload — a bound policy REFUSED a commitment, so nothing was sealed.
//
// This event exists because that refusal is otherwise durably INVISIBLE on the one-shot path: a
// policy-denied `RunDecision` errors before the seal, before the metrics tick and before the outbox
// wake, so it leaves no trace at all. For a system whose claim is an auditable decision boundary, "a
// refused action leaves no record" is the wrong failure mode. It follows the AUTHORIZE_EVALUATED
// precedent exactly: ADVISORY, not chained, sealing nothing — this event is the ONLY trace of the
// refusal, and it is a durable trace rather than a decision record.
//
// The envelope already carries tenant, namespace, session_id, occurred_at and seq, so this payload
// carries only what the envelope cannot. `decision_id` is absent on the envelope for the same reason
// it is on AUTHORIZE_EVALUATED: nothing was sealed, so there is no decision to name.
message PolicyDenied {
  // The policy that refused, as the binding named it. STAGED, not "ran under" — see the identically
  // named field on `seam.api.v1.DecisionResponse`, whose comment carries the full #561 reasoning. A
  // reader must not treat this as proof the named policy's rules are what evaluated the commitment.
  string policy_version = 1;
  // The coordination mode the refused session was opened in (`macp.mode.decision.v1` etc.).
  string mode = 2;
  // The deny reason, ALREADY REDACTED. D-030: built from the closed-set capability-class strings the
  // policy evaluator produced, never agent-proposed content — and #542 strips objector ids from them,
  // so a denial cannot leak WHO objected to a consumer that may not be entitled to know.
  //
  // ONE string rather than a repeated field, because a single joined string is what the runtime's
  // error boundary actually holds: `seam_coord_macp::map_macp_err` joins the evaluator's reasons
  // with `"; "` long before this producer sees them, and the #542 redaction emits that SAME
  // delimiter INSIDE one reason (`... (objector ids withheld; see operator logs)`). Splitting the
  // joined message back apart is therefore lossy - two reasons yield three parts, one of them
  // dangling mid-parenthetical - so a repeated field here could only ever be filled by shredding
  // the text. Consumers MUST NOT split this on `"; "`. The seam-coord-macp test
  // `the_joined_denial_message_is_not_safely_splittable` pins the hazard.
  string reason = 3;
}

// The learned-policy routing key (advisory, Plan R). Mirrors `PolicyKeyPb`.
message PolicyKey {
  string tenant = 1;
  string task_type = 2;
  string context_class = 3;
  string mode = 4;
}

// LEARNING_DECISION payload (advisory). Mirrors `LearningDecisionPb`.
message LearningDecision {
  PolicyKey policy_key = 1;
  string dimension = 2;
  string algorithm_id = 3;
  string candidate = 4;
  optional string experiment_id = 5;
  optional string algorithm_arm = 6;
  repeated double features = 7;
  optional string schema_id = 8;
  optional double propensity = 9;  // P(arm | x) at serve time — off-policy eval (matches seam-event.v1 tag 9)
}

// LEARNING_OUTCOME payload (advisory). Mirrors `LearningOutcomePb`.
message LearningOutcome {
  bool correct = 1;
  optional string verified_by = 2;
  // #354 — the per-arm OWNER key `(tenant, task_type, mode)` for deterministic per-arm ordering in
  // the learning plane ("one arm, one owner"). Derived at outcome time from the sealed
  // DecisionRecord, so `context_class` is ALWAYS EMPTY here: it is computed from request-scoped
  // features that are never sealed and CANNOT be recomputed after the decision. Do NOT treat this
  // field as full arm identity — the owner key deliberately excludes `context_class`. Absent when
  // the record has no mode or the learning plane is disabled (never a partial key with an empty
  // mode, which would silently merge arms under a coarser partition).
  PolicyKey policy_key = 3;
}

// AUDIT_ENTRY payload — a chained audit event with no sealed decision (enterprise 6.2/2.4/2.6).
message AuditEntryEvent {
  string action = 1;
  string subject = 2;
  string reason = 3;
  // rt-D §4 — the authenticated operator subject that performed a management action (`None` on the
  // unauthenticated dev-open plane). Mirrors `AuditEntryPb.actor` (tag 4).
  optional string actor = 4;
}

// The SESSION_LIFECYCLE payload (CP-09) — an advisory (non-chained) session lifecycle transition,
// `phase = "opened"` today. Mirrors the canonical `SessionLifecyclePb` (tag 21 on SeamEvent).
message SessionLifecycle {
  string phase = 1;
  string mode = 2;
  // The policy the binding named at OPEN — STAGED, not "bound". This event emits at
  // `phase = "opened"`, before anything seals, so no enforcement fact exists yet to report. The
  // stream carries the companion one event later: `DecisionSealed.policy_rules_digest` (tag 13),
  // joinable by `session_id` (#561, #600).
  string policy_version = 3;
  uint64 opened_at_millis = 4;
  // #1359 — one entry per admitted participant, in admission order: the agent and the registry
  // version the session is pinned to at Admit (never re-pinned mid-session). Set on
  // `phase = "opened"` only. The CP drain intake counts a version's live sessions from these, and
  // the session's `DECISION_SEALED` (same envelope `session_id`) ends it.
  repeated AgentPin pins = 5;
}

// A participant's registry pin as bound at session open (SESSION_LIFECYCLE `pins`).
message AgentPin {
  string agent_id = 1;
  string version = 2;
}

// BUDGET_BREACH payload — the R9 escalation signal (enterprise 6.2).
message BudgetBreach {
  string severity = 1;
  string dimension = 2;
  uint64 limit = 3;
  uint64 messages = 4;
  uint64 tokens = 5;
  uint64 cost_micros = 6;
  uint64 wall_ms = 7;
}

// ERASURE_CERTIFICATE payload — the signed, chain-anchored GDPR artifact (enterprise 2.6). Also the
// return of `seam.api.v1 SeamAdmin.EraseSubject`.
message ErasureCertificate {
  string subject = 1;
  repeated string erased = 2;
  repeated string held = 3;
  uint64 erased_at = 4;
  bytes chain_head = 5;
  string issuer_aid = 6;
  bytes signature = 7;
}

// A counterparty's signed chain-head attestation (A14 network mode). Mirrors
// `seam_trust_aitp::ChainHeadAttestation`; the signature is Ed25519 over the domain-separated,
// length-prefixed payload defined in `docs/specs/seam-event.v1.md` §CHAIN_HEAD_ATTESTATION. Also carried
// by `seam.api.v1 SeamTrust.VerifyPartyAttestation`.
message ChainHeadAttestation {
  uint64 attested_len = 1;
  bytes attested_head = 2;
  uint64 attested_at = 3;
  string issuer_aid = 4;
  uint32 digest_schema = 5;
  bytes signature = 6;
  string tenant = 7;
}
