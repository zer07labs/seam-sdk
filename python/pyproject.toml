[project]
name = "seam-sdk"
version = "0.7.56"
description = "Python SDK for the Seam decision-boundary runtime — gRPC transport + stock-crypto client shim."
readme = "README.md"
# 3.10, not 3.9: the transport stubs in `_gen` are emitted by protoc gencode 7.x, whose protobuf
# runtime requires >=3.10. Declaring 3.9 meant a 3.9 install RESOLVED fine and then failed at
# `import seam_sdk` — the failure moved from the resolver, where it is legible, to the consumer's
# first import, where it is not.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# PEP 561: the package ships inline types (py.typed below), so type checkers use them.
classifiers = ["Typing :: Typed"]
dependencies = [
    # Also DERIVED, and for exactly the reason the protobuf line below exists — the same defect was
    # sitting three lines away in this same list. The grpc stubs in `_gen` are emitted with the
    # registered-method calling convention, which needs BOTH halves of a grpcio pair:
    #
    #   * `channel.unary_unary(..., _registered_method=True)` — client side, added in grpcio 1.63.
    #   * `server.add_registered_method_handlers(...)` — server side, added in grpcio **1.64**, and
    #     emitted UNGUARDED (no hasattr check) by the plugin.
    #
    # So the floor is the later of the two. `>=1.60` let a resolver pick 1.60-1.62, where the client
    # dies at `SeamClient.connect()` with `TypeError: unexpected keyword argument
    # '_registered_method'` — worse than the protobuf case, which at least named a version error.
    # And a floor of 1.63, which is what you get by checking only the client half, installs and
    # connects fine and then raises `AttributeError: '_Server' object has no attribute
    # 'add_registered_method_handlers'` from every `add_*Servicer_to_server` — anyone implementing a
    # servicer against this contract, and every test fixture in this repo.
    #
    # Like protobuf, this moves on its own: buf's remote grpc plugin tracks latest. Unlike protobuf,
    # the emitted stub carries NO version constant to read, so tests/test_grpcio_floor.py derives the
    # requirement from the calling-convention markers actually present in `_gen`.
    "grpcio>=1.64",
    # This floor is DERIVED, not chosen: it must be >= the gencode version compiled into
    # `seam_sdk/_gen` and share its major, because protobuf's runtime-version check rejects a
    # runtime older than the gencode that generated a file. `>=5` violated that — the gencode at
    # the time was 7.35.1, so a resolver was free to install runtime 6.x and raise
    # `google.protobuf.runtime_version.VersionError` at `import seam_sdk`. That is not theoretical:
    # it took a consumer's whole test suite from 88 passing to zero collected, and the consumer had
    # no way to tell it was OUR packaging defect.
    #
    # `_gen` is regenerated by `make generate` against buf's remote plugins, which track latest — so
    # this number moves. tests/test_protobuf_floor.py derives it from the emitted stubs and fails
    # when a regenerate outruns it, which is what keeps the two in step without anyone remembering.
    # Raised 7.35.1 -> 7.36.0 by the batched regeneration that took the landed coordination
    # surface (policy_enforcement / participant_verdicts / collective_outcome / the quorum verbs):
    # buf's remote plugin emitted 7.36.0 gencode. The guard below caught it, which is the whole
    # reason it derives the number instead of trusting one.
    "protobuf>=7.36.0,<8",
    "cryptography>=42",
]

[project.optional-dependencies]
# ruff is pinned (its formatter output is version-sensitive) so `ruff format --check` agrees across CI and
# local runs.
dev = ["pytest>=7", "ruff==0.15.20"]

[tool.ruff]
target-version = "py310"
# Skip the generated transport (`seam_sdk/_gen`) — it's machine-emitted and regenerated, not ours to lint.
extend-exclude = ["_gen"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The generated transport is produced by `buf generate` + `scripts/root_gen.py` into
# `seam_sdk/_gen` (not committed — see the repo .gitignore). root_gen makes the tree REAL
# subpackages (__init__.py + rooted imports), so packages.find discovers them; the .pyi
# stubs still ride as package data.
[tool.setuptools.packages.find]
where = ["."]
include = ["seam_sdk*"]

[tool.setuptools.package-data]
# `py.typed` is the PEP 561 marker that lets type checkers read the inline annotations + .pyi stubs.
seam_sdk = ["_gen/**/*.pyi", "py.typed"]
