[project]
name = "seam-sdk"
version = "0.7.12"
description = "Python SDK for the Seam decision-boundary runtime — gRPC transport + stock-crypto client shim."
readme = "README.md"
# 3.10, not 3.9: the transport stubs in `_gen` are emitted by protoc gencode 7.x, whose protobuf
# runtime requires >=3.10. Declaring 3.9 meant a 3.9 install RESOLVED fine and then failed at
# `import seam_sdk` — the failure moved from the resolver, where it is legible, to the consumer's
# first import, where it is not.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "grpcio>=1.60",
    # This floor is DERIVED, not chosen: it must be >= the gencode version compiled into
    # `seam_sdk/_gen` and share its major, because protobuf's runtime-version check rejects a
    # runtime older than the gencode that generated a file. `>=5` violated that — the checked-in
    # gencode is 7.35.1, so a resolver was free to install runtime 6.x and raise
    # `google.protobuf.runtime_version.VersionError` at `import seam_sdk`. That is not theoretical:
    # it took a consumer's whole test suite from 88 passing to zero collected, and the consumer had
    # no way to tell it was OUR packaging defect.
    #
    # `_gen` is regenerated by `make generate` against buf's remote plugins, which track latest — so
    # this number moves. tests/test_protobuf_floor.py derives it from the emitted stubs and fails
    # when a regenerate outruns it, which is what keeps the two in step without anyone remembering.
    "protobuf>=7.35.1,<8",
    "cryptography>=42",
]

[project.optional-dependencies]
# ruff is pinned (its formatter output is version-sensitive) so `ruff format --check` agrees across CI and
# local runs.
dev = ["pytest>=7", "ruff==0.15.20"]

[tool.ruff]
target-version = "py310"
# Skip the generated transport (`seam_sdk/_gen`) — it's machine-emitted and regenerated, not ours to lint.
extend-exclude = ["_gen"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The generated transport is produced by `buf generate` + `scripts/root_gen.py` into
# `seam_sdk/_gen` (not committed — see the repo .gitignore). root_gen makes the tree REAL
# subpackages (__init__.py + rooted imports), so packages.find discovers them; the .pyi
# stubs still ride as package data.
[tool.setuptools.packages.find]
where = ["."]
include = ["seam_sdk*"]

[tool.setuptools.package-data]
seam_sdk = ["_gen/**/*.pyi"]
