# Yank (delete) a published seam-sdk version from Cloudsmith — python + npm formats ONLY.
#
# Exists because the release flow is fully automatic (runtime dispatch → stamp → publish): a
# mis-ordered merge can publish a version whose code predates its number (it happened: 0.7.7
# shipped without the authorize/aio surface). Deleting such a version is the correction — the
# packages are private/internal, so no public-registry immutability etiquette applies.
#
# Safety rails:
#   * workflow_dispatch only, version is an explicit input — nothing automatic ever yanks.
#   * `dry_run: true` (the default) lists exactly what WOULD be deleted and touches nothing.
#   * format filter is python+npm and the name must be exactly `seam-sdk` (npm scope stripped) —
#     the zer07labs Cargo crates live in the same repo and must be unreachable from here.
name: yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to delete (e.g. 0.7.7)"
        required: true
      dry_run:
        description: "true = list matches only, delete nothing"
        required: true
        default: "true"

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - name: find and delete the version's python+npm packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Dedicated key if set, else the org Cargo token — each with a leading "Bearer "
          # stripped. Same resolution as `publish.yml:369-371`, written as an `if` rather than
          # that file's `&&` one-liner because this step runs under `set -euo pipefail` and the
          # explicit form is immune to both the AND-list exit-status rule and unset variables.
          #
          # Why it matters even though it fails CLOSED: without the strip this sends
          # `X-Api-Key: Bearer …`, Cloudsmith 401s, and `curl -sf` aborts before any DELETE. So it
          # cannot delete the wrong thing — it simply never works, including in dry run, unless the
          # dedicated secret happens to be set. A safety tool that silently does not work is worse
          # than one known to be broken, because it is discovered in the incident, not before it.
          #
          # Both sources go through the same resolution, not just the Cargo one: a dedicated key
          # never carries the prefix, so stripping it costs nothing and removes one way to be
          # wrong. A source that is ONLY the prefix strips to empty, so it is skipped: if it is
          # the sole credential the step refuses below, and otherwise the other source is used.
          # Either way nothing malformed is sent — the set of inputs this refuses is a superset of
          # what it refused before, so the fix cannot make a previously-refused shape proceed.
          #
          # The surrounding-whitespace trim is why this is a function rather than two lines
          # (#111). `-z` tests for EMPTY, not blank: a secret holding a pasted trailing newline or
          # a run of spaces was "set", so the fallback to the Cargo token NEVER RAN even when that
          # secret held a good credential, the clean "no credential in scope" refusal below never
          # fired either, and a whitespace token went to Cloudsmith to fail as a confusing auth
          # error. On a yank a confusing failure is the expensive kind — the operator cannot tell
          # whether the version was deleted before it.
          #
          # ORDER IS LOAD-BEARING, in two ways this got wrong before it got right.
          #
          # Deleting ALL whitespace before the prefix strip — the obvious one-liner — turns
          # "Bearer cargo-tok" into "Bearercargo-tok", which no longer matches `${t#Bearer }` and
          # is then sent verbatim. That is a worse bug than the one being fixed.
          #
          # Trimming the TRAILING side before the strip is just as wrong for the opposite reason:
          # a source that is only "Bearer " trims to "Bearer", the pattern needs the space, and a
          # value that used to resolve to empty and fall through now resolves to the literal
          # "Bearer" and is sent. So: leading only, then strip, then trim both sides of what is
          # left.
          resolve_credential() {
            local t="$1"
            t="${t#"${t%%[![:space:]]*}"}"
            t="${t#Bearer }"
            t="${t#"${t%%[![:space:]]*}"}"; t="${t%"${t##*[![:space:]]}"}"
            printf %s "$t"
          }
          TOKEN="$(resolve_credential "${CLOUDSMITH_API_KEY:-}")"
          if [ -z "$TOKEN" ]; then
            TOKEN="$(resolve_credential "${CARGO_REGISTRIES_ZER07LABS_TOKEN:-}")"
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudsmith credential in scope."; exit 1
          fi
          case "$VERSION" in
            *[!0-9.]*|"") echo "::error::version must be plain digits-and-dots, got '$VERSION'"; exit 1 ;;
          esac

          echo "querying zer07labs/internal for seam-sdk@$VERSION (python + npm)…"
          curl -sf -H "X-Api-Key: $TOKEN" \
            "https://api.cloudsmith.io/v1/packages/zer07labs/internal/?query=seam-sdk+version:$VERSION&page_size=50" \
            > /tmp/pkgs.json

          jq -r '.[] | select(.version == env.VERSION)
                     | select(.format == "python" or .format == "npm")
                     | select((.name | sub("^@[^/]+/"; "")) == "seam-sdk")
                     | [.slug_perm, .format, .name, .version] | @tsv' /tmp/pkgs.json > /tmp/targets.tsv

          if [ ! -s /tmp/targets.tsv ]; then
            echo "::warning::no python/npm seam-sdk packages found at version $VERSION — nothing to do."
            exit 0
          fi
          echo "matched:"; column -t /tmp/targets.tsv

          if [ "$DRY_RUN" != "false" ]; then
            echo "DRY RUN — nothing deleted. Re-dispatch with dry_run=false to delete the above."
            exit 0
          fi

          while IFS=$'\t' read -r slug fmt name ver; do
            echo "deleting $fmt $name@$ver ($slug)…"
            code=$(curl -s -o /tmp/del.json -w "%{http_code}" -X DELETE -H "X-Api-Key: $TOKEN" \
              "https://api.cloudsmith.io/v1/packages/zer07labs/internal/$slug/")
            case "$code" in
              2*) echo "  deleted ($code)" ;;
              *)  echo "::error::delete failed with HTTP $code: $(cat /tmp/del.json)"; exit 1 ;;
            esac
          done < /tmp/targets.tsv
          echo "DONE — seam-sdk@$VERSION removed (python + npm)."
