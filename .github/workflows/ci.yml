name: ci

# The SDKs are generated from the *private* `seam.api.v1` contract on the BSR, so building/testing the
# transport-coupled client needs read access to it. Configure these repo secrets to enable CI:
#   * BUF_TOKEN          — a BSR token with read access to buf.build/zer07labs/seam (enables python + ts).
#   * RUNTIME_REPO_TOKEN — a PAT that can check out the private zer07labs/seam-runtime (enables the live
#                          integration job, which builds seam-grpc).
# Jobs that need a secret self-skip when it is absent — but the single required check (`ci-ok`) treats a
# skipped REQUIRED job as a failure, so a missing BUF_TOKEN turns the run red at the gate rather than
# silently green. Only `integration` is advisory (may skip, must not fail) — see the ci-ok job below.

on:
  push:
  pull_request:

jobs:
  version-lockstep:
    name: version lockstep (python == typescript)
    runs-on: ubuntu-latest
    # "One version everywhere": ts/package.json and python/pyproject.toml must always be the same version
    # (they are released together, following the runtime). Fail a PR that lets them drift.
    steps:
      - uses: actions/checkout@v4
      - name: python version must equal typescript version
        run: |
          TS=$(node -p "require('./ts/package.json').version")
          PY=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ts=$TS  py=$PY"
          if [ "$TS" != "$PY" ]; then
            echo "::error::ts/package.json ($TS) != python/pyproject.toml ($PY) — keep them equal (one version everywhere)."
            exit 1
          fi
      # The check above proves the two versions AGREE; this proves the thing that has to SET them
      # still works. Those are different properties, and only the first one was ever tested — the
      # stamp's only test run was the real release.
      - name: the version stamp still stamps
        run: ./scripts/test_set_version.sh

  preflight:
    name: preflight (secret gating)
    runs-on: ubuntu-latest
    outputs:
      have_buf_token: ${{ steps.check.outputs.have_buf_token }}
      can_integrate: ${{ steps.check.outputs.can_integrate }}
    steps:
      - id: check
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          RUNTIME_REPO_TOKEN: ${{ secrets.RUNTIME_REPO_TOKEN }}
        run: |
          if [ -n "$BUF_TOKEN" ]; then
            echo "have_buf_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_buf_token=false" >> "$GITHUB_OUTPUT"
            echo "BUF_TOKEN not set — skipping the build/test jobs (cannot read the private contract)"
          fi
          if [ -n "$BUF_TOKEN" ] && [ -n "$RUNTIME_REPO_TOKEN" ]; then
            echo "can_integrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_integrate=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: python (ruff · pytest)
    needs: preflight
    if: needs.preflight.outputs.have_buf_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # The SDK's contract-freshness gate: assert the just-generated stubs carry the surface the
      # hand-written clients call, per language (the SDK analogue of the runtime's published-surface
      # gate). STREAM=1 + EVENTS=1 are permanent hard gates: the BSR module carries the streamed-payload
      # mirror fields and SeamEvents.ReportEventsConsumed, so their absence here is a regression.
      #
      # This also hard-gates the WHOLE RPC surface against contract/rpc-manifest.txt, in both
      # directions and per language. A verb that lands on the contract and is never wired into the
      # hand-written clients now reddens CI instead of passing silently — which is exactly what
      # SubmitApprovalRequest/SubmitBallot did while every named probe stayed green.
      - name: check-contract (full surface gate)
        env:
          STREAM: "1"
          EVENTS: "1"
        run: make check-contract
      - name: install (package + dev tools)
        run: pip install -e "./python[dev]"
      - name: ruff (lint + format)
        run: |
          ruff check python
          ruff format --check python
      # Unit + cross-language conformance vectors. The live integration test self-skips (no SEAM_GRPC_BIN).
      - name: pytest
        working-directory: python
        run: pytest -q
      # BUILD THE WHEEL AND IMPORT IT, exactly as publish.yml does. Everything above this line
      # runs against an EDITABLE install of the source tree, which cannot see a packaging defect:
      # `pip install -e ./python` puts the working directory on the path, so `import seam_sdk`
      # succeeds whatever the built artifact would contain. That blind spot is not theoretical —
      # every wheel this repo published was unimportable and the whole suite stayed green over
      # it. A fresh venv is essential for the same reason.
      - name: the wheel a consumer installs actually imports
        run: |
          set -e
          python -m pip install --quiet build
          cd python && python -m build --wheel
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheelcheck/bin/python - <<'PY'
          import seam_sdk
          from seam_sdk import SeamClient, aio  # noqa: F401
          from seam_sdk._gen.seam.api.v1 import seam_pb2  # noqa: F401
          assert seam_sdk.Agent(bytes(32)).aid.startswith("aid:pubkey:ed25519:")
          print("wheel installs, imports, and derives — OK")
          PY

  typescript:
    name: typescript (typecheck · build · test)
    needs: preflight
    if: needs.preflight.outputs.have_buf_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # Same contract-freshness gate as the python job. The script probes the Python and TS stub trees
      # independently, so running it here catches a stale ts/gen even when python/_gen is fresh —
      # including the RPC-manifest comparison, which is likewise per-language for that reason.
      - name: check-contract (full surface gate)
        env:
          STREAM: "1"
          EVENTS: "1"
        run: make check-contract
      - name: install
        working-directory: ts
        run: npm ci
      - name: typecheck
        working-directory: ts
        run: npm run typecheck
      - name: build (emit JS + d.ts)
        working-directory: ts
        run: npm run build
      # Conformance vectors. The live integration test self-skips (no SEAM_GRPC_BIN / SEAM_GRPC_ADDR).
      - name: test
        working-directory: ts
        run: npm test

  integration:
    name: integration (live seam-grpc round-trip)
    needs: preflight
    if: needs.preflight.outputs.can_integrate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out the runtime (private) to build seam-grpc
        uses: actions/checkout@v4
        with:
          repository: zer07labs/seam-runtime
          token: ${{ secrets.RUNTIME_REPO_TOKEN }}
          path: _runtime
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: build seam-grpc
        run: cargo build --manifest-path _runtime/Cargo.toml -p seamd --bin seam-grpc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # Live data-plane round-trip + the management-plane (SeamAdmin) erasure/auth suite. Both spawn the
      # seam-grpc binary themselves; test_admin.py boots the second (SEAM_GRPC_MGMT_LISTEN) listener.
      - name: python live round-trip + management plane
        working-directory: python
        env:
          SEAM_GRPC_BIN: ${{ github.workspace }}/_runtime/target/debug/seam-grpc
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_integration.py tests/test_admin.py
      - name: typescript live round-trip
        working-directory: ts
        env:
          SEAM_GRPC_BIN: ${{ github.workspace }}/_runtime/target/debug/seam-grpc
        run: |
          npm ci
          npm test

  # The Go/Java/Kotlin crypto shims are standalone (no generated transport) — they need no BUF_TOKEN and
  # run unconditionally, verifying byte-for-byte reproduction of conformance/vectors.json.
  go:
    name: go (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go test
        working-directory: go
        run: go test ./...

  java:
    name: java (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: java
        run: ./gradlew test --no-daemon

  kotlin:
    name: kotlin (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: kotlin
        run: ./gradlew test --no-daemon

  verify:
    name: verify (the independent verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # THE claim, asserted. `verify/` exists to check Seam's audit chain WITHOUT trusting Seam, and the
      # only thing that makes that true is its dependency list. A verifier that links Seam's own store is
      # Seam checking Seam — which is precisely what "don't trust us, verify it yourself" says you should
      # not have to accept.
      #
      # So this is a gate, not a comment. If a Seam crate ever appears in the tree, the claim has quietly
      # stopped being true and the build says so.
      - name: the verifier must link NOTHING of Seam's
        run: |
          cd verify
          TREE=$(cargo tree -e normal)
          echo "$TREE"
          if echo "$TREE" | grep -vE '^seam-verify ' | grep -qiE '\bseam-(store|types|traits|trust|kernel|crypto|api|client|guard|coord|context|bandit)'; then
            echo "::error::seam-verify links a Seam crate. The independence claim is now false — that is the whole product."
            exit 1
          fi
          echo "OK — zero Seam crates."

      - name: fmt
        run: cd verify && cargo fmt --check
      - name: clippy
        run: cd verify && cargo clippy --all-targets -- -D warnings
      - name: test
        run: cd verify && cargo test
      # The published reference vector must verify with the shipped binary — from the issuer AID alone.
      # If this ever fails, we are shipping a fixture that does not verify, which is worse than shipping none.
      - name: the published reference vector verifies
        run: |
          cd verify
          AID=$(python3 -c "import json;print(json.load(open('fixtures/erasure_certificate_vector.json'))['issuer_aid'])")
          cargo run --quiet -- erasure-cert fixtures/erasure_certificate_vector.json --issuer "$AID"

  # ── The MSRV is a PROMISE; this is what checks it ──────────────────────────────────────────────
  # `verify/Cargo.toml` declares `rust-version`, and `verify/tests/msrv.rs` asserts that declaration
  # covers every rust-version DECLARED in the resolved graph. That is only half the promise. The
  # other half — a dependency that requires MORE than it declares — is invisible to metadata and can
  # only be caught by actually compiling at the floor. Until this job existed, nothing ever had.
  #
  # The two are complementary and neither alone is sufficient: the test catches a declaration that
  # outran us, this job catches a dependency that lied.
  #
  # WHEN THIS GOES RED: raise `rust-version` in verify/Cargo.toml to whatever the failure names.
  # DO NOT lower the toolchain here — there is no toolchain to lower, it is read from the manifest,
  # and pinning it lower would be re-breaking the promise this job exists to keep.
  verify-msrv:
    name: verify (builds at its declared MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the floor from the manifest rather than hard-coding it here. Every other floor in this
      # repo is DERIVED (the protobuf floor from the emitted stubs, the grpcio floor from the stub
      # shape, the MSRV itself from the dependency graph) — a literal in this file would be a second
      # source of truth that drifts from Cargo.toml the first time someone bumps one and not the
      # other, and CI would keep testing the old floor while every test passed.
      #
      # Fails loudly on an unparseable manifest: an empty value would otherwise install `stable` and
      # produce a green job that checks nothing, which is the vacuous-gate failure this repo has
      # already hit twice.
      - name: read the MSRV from verify/Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          # Scoped to the [package] table, not a bare line-anchored grep. `verify/Cargo.toml` opens
          # with an empty [workspace] (that is what makes the crate build standalone anywhere), so a
          # future [workspace.package] with its own `rust-version` would sit BEFORE [package] and a
          # `grep -m1` would silently read the wrong one — installing a toolchain nobody declared
          # while still looking green.
          #
          # `|| true` so a MISSING key reaches the explicit check below. Without it `set -e` kills
          # the step at the pipeline's non-zero exit, which still fails closed but says nothing
          # useful — and a gate whose failure is unreadable gets "fixed" by deleting it.
          VERSION="$(awk '
            /^\[package\]/      { in_pkg = 1; next }
            /^\[/               { in_pkg = 0 }
            in_pkg && /^rust-version[[:space:]]*=/ { print; exit }
          ' verify/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not read a version from verify/Cargo.toml's \`rust-version\` (got: '${VERSION}')."
            echo "::error::Refusing to continue — an empty value here would silently install \`stable\` and"
            echo "::error::this job would pass while checking nothing, which is worse than not running."
            exit 1
          fi
          echo "MSRV declared in verify/Cargo.toml: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # `--locked` on both: without it cargo may resolve a different graph than the committed
      # lockfile, and the job would be proving something nobody ships.
      #
      # Test, not just build. That is safe only while the dev-dependencies' MSRV stays at or below
      # the normal dependencies' — checked when this job was written, and true by a wide margin
      # (the dev-deps are a strict subset of the normal ones). Deliberately not restating the two
      # numbers here: a version in a comment cannot be enforced and goes stale silently, which is
      # the failure mode this repo keeps closing. `verify/tests/msrv.rs` computes both from
      # `cargo metadata` if you need the current values.
      #
      # If that relationship ever inverts, split this into build-at-MSRV and test-at-MSRV — do NOT
      # raise `rust-version` to satisfy a dev-dependency, since consumers never build the tests.
      - name: build at the declared MSRV
        run: cd verify && cargo build --locked
      - name: test at the declared MSRV
        run: cd verify && cargo test --locked

  # The credential-free lane: guards that hold on a bare checkout, with no BUF_TOKEN and no
  # generated code. Everything else that tests Python is gated on `preflight` — so if this lane
  # ever needed a token, the guards below would vanish in exactly the situations they matter.
  workflow-guards:
    name: guards (no credentials required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned rather than ambient: `sys.stdlib_module_names` (used by the import-light guard)
          # needs 3.10+, and a runner image bump should not be able to change what these assert.
          python-version: "3.11"
      # grpcio is here for one reason: the import-light guard loads `errors.py` standalone, and that
      # file imports grpc. If this list ever needs `buf`, a BUF_TOKEN, or the generated tree, the
      # contract in seam-sdk#54 has already been broken — the install list is itself the assertion.
      - run: pip install --quiet pyyaml pytest grpcio
      - name: the required-check gate covers every job
        run: python -m pytest scripts/test_ci_gate.py -q
      # Also runs inside the `python` job. Duplicated on purpose: there it proves the guard passes,
      # here it proves the guard needs nothing but a checkout — which is the actual claim
      # seam-adapters relies on (seam-sdk#54).
      - name: errors.py is loadable standalone (seam-adapters reads it without installing us)
        run: python -m pytest python/tests/test_errors_is_import_light.py -q

  # The single check branch protection requires. Requiring the jobs directly does not work here:
  # `integration` is SKIPPED on every PR that cannot reach a live runtime, and a skipped required
  # check blocks the merge forever. Requiring nothing is worse — `python` and `typescript` are
  # gated on `preflight`, so a PR where BUF_TOKEN does not resolve skips the SDK's core test jobs
  # and still shows green.
  #
  # So the gate splits the difference explicitly: REQUIRED jobs must succeed; ADVISORY jobs may
  # skip but must not fail. `integration` is the only advisory one, and it is advisory because it
  # needs a live seam-grpc a PR cannot always reach — a documented decision, not an accident.
  ci-ok:
    if: always()
    needs:
      - version-lockstep
      - preflight
      - python
      - typescript
      - integration
      - go
      - java
      - kotlin
      - verify
      - verify-msrv
      - workflow-guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: required jobs must SUCCEED; advisory jobs may skip but not fail
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Comma-separated. scripts/test_ci_gate.py asserts this list stays minimal.
          ADVISORY: integration
        run: |
          set -euo pipefail
          bad=$(printf '%s' "$NEEDS" | jq -r --arg adv "$ADVISORY" '
            ($adv | split(",")) as $a
            | to_entries[]
            | select(
                if (.key as $k | $a | index($k))
                then (.value.result | . != "success" and . != "skipped")
                else .value.result != "success"
                end)
            | "  \(.key): \(.value.result)"')
          printf '%s' "$NEEDS" | jq -r --arg adv "$ADVISORY" '
            ($adv | split(",")) as $a | to_entries[]
            | select(.key as $k | $a | index($k))
            | "advisory  \(.key): \(.value.result)"'
          if [ -n "$bad" ]; then
            echo "::error::not every required job succeeded"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "all required jobs succeeded"
