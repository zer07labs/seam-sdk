name: ci

# The SDKs are generated from the *private* `seam.api.v1` contract on the BSR, so building/testing the
# transport-coupled client needs read access to it. Configure these repo secrets to enable CI:
#   * BUF_TOKEN          — a BSR token with read access to buf.build/zer07labs/seam (enables python + ts).
#   * SEAM_BOT_APP_ID / SEAM_BOT_PRIVATE_KEY — the org's seam-deps-bot App, already installed on
#                          seam-runtime. `spec-pin` and `integration` each mint a short-lived token
#                          from it, scoped to that one repo, instead of needing a PAT.
# `RUNTIME_REPO_TOKEN` is gone. It was never configured — not on this repo, not on the org — so the
# `integration` job it gated skipped on every run this repo has ever had. It is not replaced with an
# equivalent: see the note on that job for why pulling a published image is a narrower grant than
# checking out private source.
# Jobs that need a secret self-skip when it is absent — but the single required check (`ci-ok`) treats a
# skipped REQUIRED job as a failure, so a missing BUF_TOKEN turns the run red at the gate rather than
# silently green. `integration` and `spec-pin` are the only advisory jobs (may skip, must not fail) — see
# the ci-ok job below.

on:
  push:
  pull_request:

jobs:
  version-lockstep:
    name: version lockstep (python == typescript)
    runs-on: ubuntu-latest
    # "One version everywhere": ts/package.json and python/pyproject.toml must always be the same version
    # (they are released together, following the runtime). Fail a PR that lets them drift.
    steps:
      - uses: actions/checkout@v4
      - name: python version must equal typescript version
        run: |
          TS=$(node -p "require('./ts/package.json').version")
          PY=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ts=$TS  py=$PY"
          if [ "$TS" != "$PY" ]; then
            echo "::error::ts/package.json ($TS) != python/pyproject.toml ($PY) — keep them equal (one version everywhere)."
            exit 1
          fi
      # The check above proves the two versions AGREE; this proves the thing that has to SET them
      # still works. Those are different properties, and only the first one was ever tested — the
      # stamp's only test run was the real release.
      - name: the version stamp still stamps
        run: ./scripts/test_set_version.sh

  preflight:
    name: preflight (secret gating)
    runs-on: ubuntu-latest
    outputs:
      have_buf_token: ${{ steps.check.outputs.have_buf_token }}
      have_bot_app: ${{ steps.check.outputs.have_bot_app }}
      can_integrate: ${{ steps.check.outputs.can_integrate }}
    steps:
      - id: check
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          SEAM_BOT_APP_ID: ${{ secrets.SEAM_BOT_APP_ID }}
          SEAM_BOT_PRIVATE_KEY: ${{ secrets.SEAM_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$BUF_TOKEN" ]; then
            echo "have_buf_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_buf_token=false" >> "$GITHUB_OUTPUT"
            echo "BUF_TOKEN not set — skipping the build/test jobs (cannot read the private contract)"
          fi
          # `spec-pin` reads ONE doc out of the private runtime through the API and builds nothing,
          # so it needs neither BUF_TOKEN nor a checkout — just something that can read that repo.
          # It uses the seam-deps-bot App rather than a PAT: the App already exists org-wide, is
          # already installed on seam-runtime (see seam's golden-gate.yml, which scopes a token to
          # exactly that repo), and its token is short-lived and scoped per run. A PAT would have
          # meant a new long-lived credential for a read two org workflows already perform.
          if [ -n "$SEAM_BOT_APP_ID" ] && [ -n "$SEAM_BOT_PRIVATE_KEY" ]; then
            echo "have_bot_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_bot_app=false" >> "$GITHUB_OUTPUT"
            echo "seam-deps-bot App secrets absent — skipping spec-pin (a fork PR cannot read the private spec)"
          fi
          # `integration` needs only BUF_TOKEN. It pulls the seamd image with the workflow's own
          # GITHUB_TOKEN, so it adds no secret of its own — but BUF_TOKEN is what a fork PR lacks,
          # which is still why the job is allowed to skip rather than required.
          if [ -n "$BUF_TOKEN" ]; then
            echo "can_integrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_integrate=false" >> "$GITHUB_OUTPUT"
            echo "integration cannot run (no BUF_TOKEN, so the transport stubs cannot be generated)"
          fi

  python:
    name: python (ruff · pytest)
    needs: preflight
    if: needs.preflight.outputs.have_buf_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # The SDK's contract-freshness gate: assert the just-generated stubs carry the surface the
      # hand-written clients call, per language (the SDK analogue of the runtime's published-surface
      # gate). STREAM=1 + EVENTS=1 are permanent hard gates: the BSR module carries the streamed-payload
      # mirror fields and SeamEvents.ReportEventsConsumed, so their absence here is a regression.
      #
      # This also hard-gates the WHOLE RPC surface against contract/rpc-manifest.txt, in both
      # directions and per language. A verb that lands on the contract and is never wired into the
      # hand-written clients now reddens CI instead of passing silently — which is exactly what
      # SubmitApprovalRequest/SubmitBallot did while every named probe stayed green.
      - name: check-contract (full surface gate)
        env:
          STREAM: "1"
          EVENTS: "1"
        run: make check-contract
      - name: install (package + dev tools)
        run: pip install -e "./python[dev]"
      - name: ruff (lint + format)
        run: |
          ruff check python
          ruff format --check python
      # Unit + cross-language conformance vectors. The live integration test self-skips (no SEAM_GRPC_BIN).
      #
      # SEAM_REQUIRE_WHEEL_BUILD=1 turns test_packaging.py's "could not build the wheel" SKIP into a
      # failure. Those three tests are the only check that the wheel ships no global `seam` package,
      # ships `py.typed`, and has a rooted `__init__.py` chain — and their skip condition used to
      # swallow a wheel build that RAN AND FAILED, so a packaging defect retired its own guards and
      # pytest still exited 0. This is `ci-ok`'s "a skipped required job is a failure" rule, applied
      # one level down, where the runner always has pip and a skip has no legitimate cause.
      - name: pytest
        working-directory: python
        env:
          SEAM_REQUIRE_WHEEL_BUILD: "1"
        run: pytest -q
      # BUILD THE WHEEL AND IMPORT IT, exactly as publish.yml does. Everything above this line
      # runs against an EDITABLE install of the source tree, which cannot see a packaging defect:
      # `pip install -e ./python` puts the working directory on the path, so `import seam_sdk`
      # succeeds whatever the built artifact would contain. That blind spot is not theoretical —
      # every wheel this repo published was unimportable and the whole suite stayed green over
      # it. A fresh venv is essential for the same reason.
      - name: the wheel a consumer installs actually imports
        run: |
          set -e
          python -m pip install --quiet build
          cd python && python -m build --wheel
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheelcheck/bin/python - <<'PY'
          import seam_sdk
          from seam_sdk import SeamClient, aio  # noqa: F401
          from seam_sdk._gen.seam.api.v1 import seam_pb2  # noqa: F401
          assert seam_sdk.Agent(bytes(32)).aid.startswith("aid:pubkey:ed25519:")
          print("wheel installs, imports, and derives — OK")
          PY

  typescript:
    name: typescript (typecheck · build · test)
    needs: preflight
    if: needs.preflight.outputs.have_buf_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # Same contract-freshness gate as the python job. The script probes the Python and TS stub trees
      # independently, so running it here catches a stale ts/gen even when python/_gen is fresh —
      # including the RPC-manifest comparison, which is likewise per-language for that reason.
      - name: check-contract (full surface gate)
        env:
          STREAM: "1"
          EVENTS: "1"
        run: make check-contract
      - name: install
        working-directory: ts
        run: npm ci
      - name: typecheck
        working-directory: ts
        run: npm run typecheck
      - name: build (emit JS + d.ts)
        working-directory: ts
        run: npm run build
      # Conformance vectors. The live integration test self-skips (no SEAM_GRPC_BIN / SEAM_GRPC_ADDR).
      - name: test
        working-directory: ts
        run: npm test

  # This job did not run for the entire life of this repository. It gated on `RUNTIME_REPO_TOKEN`,
  # which was configured neither here nor on the org, so `can_integrate` was never true — and because
  # the job is advisory, nothing ever went red over it. The live round-trip was simply never executed
  # while appearing in every check list. Found while wiring `spec-pin` (2026-08-25), fixed here.
  #
  # It is NOT fixed by handing the old design a working token. That design checked out the private
  # runtime and ran `cargo build` on it — executing another repository's `build.rs` and proc macros
  # with a repo-scoped credential live in the environment for everything that followed. This one
  # pulls the already-published `seamd` image and lifts `seam-grpc` out of it, so NO new credential
  # exists at all: `seamd` is an `internal` package, readable by this workflow's own GITHUB_TOKEN
  # with `packages: read`. No source is fetched. It is also minutes faster, and it exercises the
  # artifact the fleet actually deploys rather than a debug build of the same commit.
  #
  # A seam-deps-bot App token was tried first and is strictly worse on both axes: GHCR denied it
  # scoped to seam-runtime AND scoped to the org, because `internal` visibility does not extend to a
  # GitHub App installation — and it would have been a wider credential for the identical read.
  #
  # `seam-grpc` links only libc/libm/libgcc (verified), and the image is Debian 12 (glibc 2.36) while
  # the runner is newer — so the extracted binary runs natively and BOTH suites spawn it exactly as
  # they were already written to, with no test changes. That matters: pointing the tests at a
  # long-lived server over SEAM_GRPC_ADDR instead is NOT equivalent — they assume a fresh server per
  # fixture, and a shared one fails with `duplicate SessionStart for an already-open session`, while
  # test_admin.py skips outright because it needs to bind its own management listener.
  #
  # The tag is `main`, deliberately: an SDK PR is tested against the runtime the SDK must be in
  # lockstep with, so contract drift reddens here rather than at release. Pinning a digest would make
  # this reproducible and silently stale — the exact failure `spec-pin` exists to prevent.
  integration:
    name: integration (live seam-grpc round-trip)
    needs: preflight
    if: needs.preflight.outputs.can_integrate == 'true'
    runs-on: ubuntu-latest
    # Bounded because this job SPAWNS A SERVER. If the binary ever stops recognising a flag and
    # starts serving instead of exiting, an unbounded job waits on the 6-hour platform default.
    timeout-minutes: 20
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: lift seam-grpc out of the published seamd image
        env:
          # The repository's OWN token, and nothing else. `seamd` is an `internal` package, which a
          # sibling repo's GITHUB_TOKEN can read given `packages: read` above — verified on this
          # branch. A seam-deps-bot App token was tried first and is strictly worse: GHCR denied it
          # both repo-scoped and org-scoped (internal visibility does not extend to an App
          # installation), and it would have been a wider credential for the same read.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zer07labs/seam-runtime/seamd:main
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u x-access-token --password-stdin
          if ! docker pull -q "$IMAGE"; then
            echo '::error::Cannot pull the seamd image. A successful docker login followed by a'\
                 ' denied pull means the token authenticated but is not authorised for this'\
                 ' package. GHCR does not treat an internal package as readable by a GitHub App'\
                 ' installation token: the package must grant access explicitly. Check the'\
                 ' package settings for seam-runtime/seamd. This is not a flake; re-running will'\
                 ' not fix it.'
            exit 1
          fi
          cid="$(docker create "$IMAGE")"
          docker cp "$cid:/usr/local/bin/seam-grpc" "$GITHUB_WORKSPACE/seam-grpc"
          docker rm "$cid" >/dev/null
          # Nothing below this line needs the registry, and everything below it runs third-party
          # code (cargo/npm/pip resolve and execute other people's build hooks). Drop the credential
          # here rather than leaving it in the environment for the rest of the job.
          docker logout ghcr.io >/dev/null
          chmod +x "$GITHUB_WORKSPACE/seam-grpc"
          # Prove it actually executes on this runner before the suites blame themselves for a
          # binary that cannot start. `--version` may not be a supported flag; the exit code is not
          # what is being checked, the dynamic loader is.
          # `timeout` because the failure mode is not "wrong exit code" but "starts serving": an
          # unrecognised flag could leave this waiting forever. The exit code is not what is being
          # checked here — `ldd` below is the real assertion, and it invokes the dynamic loader, so
          # it catches a missing library or a GLIBC symbol-version mismatch rather than mere presence.
          timeout 10s "$GITHUB_WORKSPACE/seam-grpc" --version 2>&1 | head -1 || true
          ldd "$GITHUB_WORKSPACE/seam-grpc"
      # The suites now capture the server's output per spawn (python/tests/live_server.py), so this
      # step is no longer the only place a startup failure is visible. It stays because it fails
      # FAST and unambiguously: if the binary itself cannot serve, this reddens before pip, npm and
      # codegen have run, and it does so with the binary's own output rather than a test-suite error.
      - name: smoke — the binary must actually serve before the suites depend on it
        run: |
          set -uo pipefail
          SEAM_GRPC_LISTEN=127.0.0.1:8099 SEAM_DEV_INSECURE=1 \
            "$GITHUB_WORKSPACE/seam-grpc" > /tmp/seam-grpc.log 2>&1 &
          pid=$!
          # Reap it, do not merely signal it. SIGTERM starts a graceful drain, so a bare `kill`
          # followed by `exit 0` leaves this step's server still holding 8099 while later steps run.
          # The suites no longer use a fixed port (see python/tests/live_server.py, #85), so this is
          # now hygiene rather than a collision — but a step that abandons a process it started is
          # wrong on its own terms, and it was indistinguishable from the real defect until it wasn't.
          reap() {
            kill "$1" 2>/dev/null || return 0
            for _ in $(seq 1 40); do
              kill -0 "$1" 2>/dev/null || return 0
              sleep 0.25
            done
            kill -9 "$1" 2>/dev/null || true
            wait "$1" 2>/dev/null || true
          }
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; then
              echo "seam-grpc is serving on 8099"
              reap "$pid"
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || break   # it died; stop waiting on a corpse
            sleep 0.5
          done
          echo "::error::seam-grpc did not serve. Its own output follows — this is the binary's"\
               ' failure, not the test suite'"'"'s.'
          cat /tmp/seam-grpc.log
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
      - name: generate the transport stubs from the contract
        # `make generate`, NOT raw `buf generate`: the Makefile target also runs
        # scripts/root_gen.py, which rewrites the generated absolute imports into rooted
        # `seam_sdk._gen.*` subpackages. Raw buf output does not import.
        run: make generate
      # Live data-plane round-trip + the management-plane (SeamAdmin) erasure/auth suite. Both spawn the
      # seam-grpc binary themselves; test_admin.py boots the second (SEAM_GRPC_MGMT_LISTEN) listener.
      - name: python live round-trip + management plane
        working-directory: python
        env:
          SEAM_GRPC_BIN: ${{ github.workspace }}/seam-grpc
        run: |
          pip install -e ".[dev]"
          # EVERY file with a live SEAM_GRPC_BIN gate, not a subset. This ran two of four, so
          # test_streamed_decode.py and test_verify_attestation.py self-skipped here forever while
          # `npm test` ran their TypeScript twins in full. That asymmetry is exactly how the stale
          # `schema_version == 2` assertion survived on the Python side and was caught on the TS one.
          pytest -q tests/test_integration.py tests/test_admin.py \
                    tests/test_streamed_decode.py tests/test_verify_attestation.py
      - name: typescript live round-trip
        working-directory: ts
        env:
          SEAM_GRPC_BIN: ${{ github.workspace }}/seam-grpc
        run: |
          npm ci
          npm test
      # #85's explicit ask. The old fixtures sent the server's output to DEVNULL, so a failure that
      # did not reproduce left NOTHING behind — and every re-run overwrote the smoke log too. The
      # helper now writes one log per spawn; these two steps are what make those logs survive a run
      # that goes red, so the next occurrence is diagnosed from evidence rather than re-theorised.
      #
      # They are LAST in the job on purpose. A step runs at its own position and nowhere else, so an
      # `if: failure()` dump placed above `typescript live round-trip` is evaluated — and skipped,
      # nothing having failed yet — before that step ever runs, leaving the TS lane with no dump and
      # no artifact. Last is the only position that covers both live lanes.
      - name: the server's own output, when a live suite fails
        if: failure()
        run: |
          set -uo pipefail
          echo "::group::smoke-step log"
          cat /tmp/seam-grpc.log 2>/dev/null || echo "(none)"
          echo "::endgroup::"
          # `find` must reach pytest's tmp_path, not just its root. Every fixture passes `tmp_path`,
          # so a per-spawn log lands at /tmp/pytest-of-runner/pytest-N/<testname>0/seam-grpc-N.log —
          # FOUR levels below /tmp. The `-maxdepth 3` this replaced stopped one short and printed
          # nothing at all, which is precisely the failure this step exists to prevent.
          # The roots are deduplicated because `find /tmp /tmp ...` reports every match twice.
          roots="/tmp"
          if [ -n "${TMPDIR:-}" ] && [ "${TMPDIR%/}" != "/tmp" ]; then
            roots="$roots ${TMPDIR%/}"
          fi
          # Everything found is ALSO staged under one fixed directory, because the upload step's
          # `path:` is a static glob and cannot follow $TMPDIR. Staging makes the artifact
          # independent of where pytest actually put its tmp_path, rather than silently uploading
          # nothing — the same "the glob quietly stopped matching" failure as the depth bug above.
          stage=/tmp/seam-live-logs
          mkdir -p "$stage" 2>/dev/null || true   # guarded, for the reason `cat` is — see below
          cp /tmp/seam-grpc.log "$stage/smoke.log" 2>/dev/null || true
          found=0
          # `-type f` and `|| true`: this step runs while things are already broken, so one
          # unreadable or vanished match must not abort the loop under `bash -e` and take the
          # remaining logs — and the warning below — down with it. The `mkdir` above carries the
          # same guard for the same reason: the commit that added these guards introduced an
          # unguarded `mkdir`, and with $stage existing as a regular file the whole step exited 1
          # before printing a single log. Every command in this step must be unable to abort it.
          for f in $(find $roots -maxdepth 6 -type f -name 'seam-grpc-*.log' 2>/dev/null | head -40); do
            found=1
            echo "::group::$f"
            cat "$f" || true
            echo "::endgroup::"
            cp "$f" "$stage/$(printf '%s' "${f#/}" | tr / _)" 2>/dev/null || true
          done
          if [ "$found" = 0 ]; then
            echo "::warning::no per-spawn seam-grpc log found under $roots — either no live fixture" \
                 "ran, or live_server.py's log_dir no longer lands there"
          fi
      - name: keep the live-server logs as an artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-server-logs
          # `warn`, not `ignore`: an empty upload is indistinguishable from a successful one, and a
          # glob that silently stops matching is how this evidence would disappear again.
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/seam-grpc.log
            /tmp/seam-live-logs/**
            /tmp/**/seam-grpc-*.log

  # The Go/Java/Kotlin crypto shims are standalone (no generated transport) — they need no BUF_TOKEN and
  # run unconditionally, verifying byte-for-byte reproduction of conformance/vectors.json.
  go:
    name: go (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go test
        working-directory: go
        run: go test ./...

  java:
    name: java (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: java
        run: ./gradlew test --no-daemon

  kotlin:
    name: kotlin (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: kotlin
        run: ./gradlew test --no-daemon

  verify:
    name: verify (the independent verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # THE claim, asserted. `verify/` exists to check Seam's audit chain WITHOUT trusting Seam, and the
      # only thing that makes that true is its dependency list. A verifier that links Seam's own store is
      # Seam checking Seam — which is precisely what "don't trust us, verify it yourself" says you should
      # not have to accept.
      #
      # So this is a gate, not a comment. If a Seam crate ever appears in the tree, the claim has quietly
      # stopped being true and the build says so. The check itself lives in one script
      # (`scripts/check-independence.sh`), also called from `publish.yml` — see that script's header for
      # why it is a denylist rather than the allowlist this replaced.
      - name: the verifier must link NOTHING of Seam's
        run: ./scripts/check-independence.sh

      - name: fmt
        run: cd verify && cargo fmt --check
      - name: clippy
        run: cd verify && cargo clippy --all-targets -- -D warnings
      - name: test
        run: cd verify && cargo test
      # The published reference vector must verify with the shipped binary — from the issuer AID alone.
      # If this ever fails, we are shipping a fixture that does not verify, which is worse than shipping none.
      - name: the published reference vector verifies
        run: |
          cd verify
          AID=$(python3 -c "import json;print(json.load(open('fixtures/erasure_certificate_vector.json'))['issuer_aid'])")
          cargo run --quiet -- erasure-cert fixtures/erasure_certificate_vector.json --issuer "$AID"

  # ── The MSRV is a PROMISE; this is what checks it ──────────────────────────────────────────────
  # `verify/Cargo.toml` declares `rust-version`, and `verify/tests/msrv.rs` asserts that declaration
  # covers every rust-version DECLARED in the resolved graph. That is only half the promise. The
  # other half — a dependency that requires MORE than it declares — is invisible to metadata and can
  # only be caught by actually compiling at the floor. Until this job existed, nothing ever had.
  #
  # The two are complementary and neither alone is sufficient: the test catches a declaration that
  # outran us, this job catches a dependency that lied.
  #
  # WHEN THIS GOES RED: raise `rust-version` in verify/Cargo.toml to whatever the failure names.
  # DO NOT lower the toolchain here — there is no toolchain to lower, it is read from the manifest,
  # and pinning it lower would be re-breaking the promise this job exists to keep.
  verify-msrv:
    name: verify (builds at its declared MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the floor from the manifest rather than hard-coding it here. Every other floor in this
      # repo is DERIVED (the protobuf floor from the emitted stubs, the grpcio floor from the stub
      # shape, the MSRV itself from the dependency graph) — a literal in this file would be a second
      # source of truth that drifts from Cargo.toml the first time someone bumps one and not the
      # other, and CI would keep testing the old floor while every test passed.
      #
      # Fails loudly on an unparseable manifest: an empty value would otherwise install `stable` and
      # produce a green job that checks nothing, which is the vacuous-gate failure this repo has
      # already hit twice.
      - name: read the MSRV from verify/Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          # Scoped to the [package] table, not a bare line-anchored grep. `verify/Cargo.toml` opens
          # with an empty [workspace] (that is what makes the crate build standalone anywhere), so a
          # future [workspace.package] with its own `rust-version` would sit BEFORE [package] and a
          # `grep -m1` would silently read the wrong one — installing a toolchain nobody declared
          # while still looking green.
          #
          # `|| true` so a MISSING key reaches the explicit check below. Without it `set -e` kills
          # the step at the pipeline's non-zero exit, which still fails closed but says nothing
          # useful — and a gate whose failure is unreadable gets "fixed" by deleting it.
          VERSION="$(awk '
            /^\[package\]/      { in_pkg = 1; next }
            /^\[/               { in_pkg = 0 }
            in_pkg && /^rust-version[[:space:]]*=/ { print; exit }
          ' verify/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not read a version from verify/Cargo.toml's \`rust-version\` (got: '${VERSION}')."
            echo "::error::Refusing to continue — an empty value here would silently install \`stable\` and"
            echo "::error::this job would pass while checking nothing, which is worse than not running."
            exit 1
          fi
          echo "MSRV declared in verify/Cargo.toml: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # `--locked` on both: without it cargo may resolve a different graph than the committed
      # lockfile, and the job would be proving something nobody ships.
      #
      # Test, not just build. That is safe only while the dev-dependencies' MSRV stays at or below
      # the normal dependencies' — checked when this job was written, and true by a wide margin
      # (the dev-deps are a strict subset of the normal ones). Deliberately not restating the two
      # numbers here: a version in a comment cannot be enforced and goes stale silently, which is
      # the failure mode this repo keeps closing. `verify/tests/msrv.rs` computes both from
      # `cargo metadata` if you need the current values.
      #
      # If that relationship ever inverts, split this into build-at-MSRV and test-at-MSRV — do NOT
      # raise `rust-version` to satisfy a dev-dependency, since consumers never build the tests.
      - name: build at the declared MSRV
        run: cd verify && cargo build --locked
      - name: test at the declared MSRV
        run: cd verify && cargo test --locked

  # The credential-free lane: guards that hold on a bare checkout, with no BUF_TOKEN and no
  # generated code. Everything else that tests Python is gated on `preflight` — so if this lane
  # ever needed a token, the guards below would vanish in exactly the situations they matter.
  # ── The vendored spec claims to be VERBATIM; this is the only thing that can check it ─────────
  # `verify/docs/seam-event.v1.md` is a pinned copy of seam-runtime's spec, and it is what a third
  # party builds a verifier from when they have no runtime checkout — the whole independence claim.
  # It went stale three times, and each time a person or a review gate caught it, because no test
  # in this repo COULD: the proof lives in another repository and has to be fetched.
  #
  # This is the only job that reaches out and fetches it. Advisory in `ci-ok` — it reads a private
  # repo, so it cannot run on a fork PR — but advisory means "may skip, must not fail", so drift
  # still blocks the merge. That is the point, and it was a deliberate call: a warning nobody acts
  # on is how all three stalenesses survived.
  #
  # WHEN THIS GOES RED: re-copy the spec whole-file (never cherry-pick — verbatim is the property
  # being claimed) and update the sha in its header. The failure message spells out the commands.
  # If the diff changes normative behaviour, the verifier and its tests need the same change too.
  spec-pin:
    name: spec pin (the vendored spec is verbatim and current)
    needs: preflight
    if: needs.preflight.outputs.have_bot_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scoped to seam-runtime and nothing else. The App can reach several repos (seam's
      # golden-gate.yml scopes it to three); this job reads one file, so it asks for one repo.
      - name: Mint a seam-deps-bot App token, scoped to seam-runtime
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEAM_BOT_APP_ID }}
          private-key: ${{ secrets.SEAM_BOT_PRIVATE_KEY }}
          owner: zer07labs
          repositories: seam-runtime
      - name: the vendored spec must match seam-runtime, byte for byte
        env:
          # NOT github.token: seam-runtime is private and the default token is scoped to this repo,
          # so it would 404 and this gate would fail for a reason unrelated to the spec.
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/check_vendored_spec.py --from gh

  workflow-guards:
    name: guards (no credentials required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned rather than ambient: `sys.stdlib_module_names` (used by the import-light guard)
          # needs 3.10+, and a runner image bump should not be able to change what these assert.
          python-version: "3.11"
      # grpcio and cryptography are here for one reason each: the import-light guard loads
      # `errors.py` and `crypto.py` standalone, and those files import grpc and cryptography
      # respectively. Both have an out-of-repo consumer that loads them as a single file —
      # seam-adapters' drift lane (seam-sdk#54) and seam-runtime's sdk-digest-parity gate. If this
      # list ever needs `buf`, a BUF_TOKEN, or the generated tree, that contract has already been
      # broken — the install list is itself the assertion.
      - run: pip install --quiet pyyaml pytest grpcio cryptography
      - name: the required-check gate covers every job
        run: python -m pytest scripts/test_ci_gate.py -q
      # The release gate reads contract/wire-framing.json out of the checkout, so its position
      # relative to actions/checkout is load-bearing. It sat before it for a day and failed four
      # releases closed without ever running its comparison — see the module docstring.
      - name: the release framing gate is where it can actually run
        run: python -m pytest scripts/test_release_gate.py -q
      # publish.yml's CI gate races the CI it checks (commit push starts ci.yml, tag push starts
      # publish.yml). These execute the real gate script against a stubbed gh, so "waits for a
      # transient absence" and "still refuses a settled red" are both proven, not just read.
      - name: the publish CI gate waits without going soft
        run: python -m pytest scripts/test_publish_gate.py -q
      # The spec-pin CHECKER, exercised here against throwaway git repos — no token, no network.
      # spec-pin itself skips without the seam-deps-bot App secrets, so on a fork PR this lane is the only
      # thing keeping the checker's own logic honest.
      - name: the vendored-spec checker fails on every kind of drift
        run: python -m pytest scripts/test_vendored_spec_gate.py -q
      # yank.yml deletes published artifacts and is only ever run during an incident, so a defect
      # in it is discovered at the worst possible moment. It shipped with a token bug that made
      # every invocation 401 — a CLOSED failure, and therefore an invisible one. These guards
      # execute the credential resolution and pin the three filters that scope the deletion.
      - name: the yank tool would actually authenticate, and deletes nothing wider than it should
        run: python -m pytest scripts/test_yank_gate.py -q
      # scripts/check-independence.sh is driven with synthetic `cargo tree` text here (stdin/file
      # arg), not the real `cargo tree -e normal` — this lane installs no Rust toolchain on purpose
      # (see the comment on the install list above), and the script's default invocation is what
      # `ci.yml`'s `verify` job exercises against the real tree instead.
      - name: the independence gate is a denylist that actually catches a Seam crate
        run: python -m pytest scripts/test_independence_gate.py -q
      # Also runs inside the `python` job. Duplicated on purpose: there it proves the guard passes,
      # here it proves the guard needs nothing but a checkout — which is the actual claim
      # seam-adapters relies on (seam-sdk#54).
      - name: errors.py is loadable standalone (seam-adapters reads it without installing us)
        run: python -m pytest python/tests/test_errors_is_import_light.py -q

  # The single check branch protection requires. Requiring the jobs directly does not work here:
  # `integration` is SKIPPED on every PR that cannot reach a live runtime, and a skipped required
  # check blocks the merge forever. Requiring nothing is worse — `python` and `typescript` are
  # gated on `preflight`, so a PR where BUF_TOKEN does not resolve skips the SDK's core test jobs
  # and still shows green.
  #
  # So the gate splits the difference explicitly: REQUIRED jobs must succeed; ADVISORY jobs may
  # skip but must not fail. Two jobs are advisory, both for the same reason and no other — they
  # need a secret a fork PR cannot have: `integration` pulls the published seamd image to get a live
  # seam-grpc, and `spec-pin` reads the private spec it compares against. Both mint a short-lived
  # seam-deps-bot App token, which a fork run cannot do. Documented decisions, not accidents. Note
  # what advisory does NOT mean: a job here that RUNS and FAILS still reddens this gate — which is
  # why spec-pin drift blocks a merge, and why `integration` finally running now carries real teeth.
  ci-ok:
    if: always()
    needs:
      - version-lockstep
      - preflight
      - python
      - typescript
      - integration
      - go
      - java
      - kotlin
      - verify
      - verify-msrv
      - spec-pin
      - workflow-guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: required jobs must SUCCEED; advisory jobs may skip but not fail
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Comma-separated. scripts/test_ci_gate.py asserts this list stays minimal.
          ADVISORY: integration,spec-pin
        run: |
          set -euo pipefail
          bad=$(printf '%s' "$NEEDS" | jq -r --arg adv "$ADVISORY" '
            ($adv | split(",")) as $a
            | to_entries[]
            | select(
                if (.key as $k | $a | index($k))
                then (.value.result | . != "success" and . != "skipped")
                else .value.result != "success"
                end)
            | "  \(.key): \(.value.result)"')
          printf '%s' "$NEEDS" | jq -r --arg adv "$ADVISORY" '
            ($adv | split(",")) as $a | to_entries[]
            | select(.key as $k | $a | index($k))
            | "advisory  \(.key): \(.value.result)"'
          if [ -n "$bad" ]; then
            echo "::error::not every required job succeeded"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "all required jobs succeeded"
