name: publish (internal — Cloudsmith zer07labs/internal)

# Cut an INTERNAL release. Push a version tag `vX.Y.Z` (matching the package versions) and this publishes
# the npm package (@zer07labs/seam-sdk) AND the Python wheel (seam-sdk) to the org's PRIVATE Cloudsmith
# repo `zer07labs/internal` — the SAME registry the Rust crates already use (docs: seam-runtime
# .cargo/config.toml + docs/deployment.md § Publishing). NOTHING goes to public npmjs / PyPI.
#
# A published version is IMMUTABLE per registry — a re-cut needs a version bump. Confirm the tag matches the
# in-tree versions (the version-check job below enforces it, so a stale tag fails loud instead of no-op'ing).
#
# Required repo/org secrets:
#   BUF_TOKEN          — read access to buf.build/zer07labs/seam (to generate the transport stubs from the
#                        BSR — the release source; a git checkout does NOT carry them, they're .gitignored).
#   CLOUDSMITH_API_KEY — a Cloudsmith API key with push to zer07labs/internal (npm + python formats enabled
#                        on the repo). The RAW key — no "Bearer "/"Token " prefix (npm and twine add their
#                        own). Distinct from the Cargo CI's CARGO_REGISTRIES_ZER07LABS_TOKEN, which carries a
#                        literal "Bearer " prefix; do not reuse that value verbatim here.
#
# Endpoint hosts follow the established per-format Cloudsmith convention (cargo.cloudsmith.io/… → npm/python
# equivalents). If a push 4xx's on the URL, confirm it against Cloudsmith → the repo → "Set Me Up".

on:
  push:
    tags: ["v*"]
  # Manual only, for `publish-verify` (the verifier crate → Cloudsmith). The tag-triggered jobs below all
  # need a `vX.Y.Z` ref and are skipped on a manual run; `publish-verify` gates on this event
  # explicitly. Without this trigger that job could never run at all.
  workflow_dispatch:

permissions:
  contents: read
  # `ci-green` below reads this commit's check runs to decide whether CI passed. Read-only.
  checks: read
  actions: read

jobs:
  # ── G3: publish is gated on CI, not just on the tag matching ───────────────────────────────────
  # Before this job, `publish.yml` needed only `version-check` — so a tag pushed at a red commit
  # published anyway. That is not hypothetical here: 0.7.17 shipped ELEVEN MINUTES after the
  # runtime wire change that broke it, and 0.7.18/0.7.19 repeated it.
  #
  # This cannot be a plain `needs:` on ci.yml's `ci-ok`. Workflows are separate runs: CI runs on
  # the branch push/PR, publish runs on the tag push, and `needs:` only orders jobs WITHIN a run.
  # So the CI conclusion for this exact commit has to be resolved through the API.
  #
  # FAILS CLOSED ON ABSENT, not only on failure. A tag pushed at a commit CI never ran on has no
  # `ci-ok` conclusion to read, and treating "not failed" as "fine" is exactly the reasoning that
  # would have let 0.7.17 through. No conclusion is a refusal.
  #
  # It WAITS for a transient absence, because publish RACES the CI it is checking. Both the commit
  # and the tag are pushed by the same release step seconds apart: the commit push starts ci.yml,
  # the tag push starts this workflow. Read once, immediately, and the answer is "absent" — not
  # because CI failed but because it has not registered yet. That is what happened on v0.7.47, which
  # refused with publish fired at 03:24:39Z and ci-ok appearing at 03:25:26Z: it lost by 47 seconds
  # and needed a hand re-run.
  #
  # Waiting does NOT soften the gate, because only the two genuinely transient states are waited on:
  #   * absent    — CI has not registered yet; it may still appear
  #   * pending   — a ci-ok is in flight; it may still settle
  # A SETTLED non-success (failure/cancelled/timed_out/neutral/...) refuses IMMEDIATELY without
  # burning the ceiling — waiting cannot turn a red run green. And a timeout is a REFUSAL, never a
  # pass: running out of patience is not evidence of success.
  ci-green:
    name: CI is green for this commit
    # Tag-triggered only: a manual run has no vX.Y.Z ref to check (see workflow_dispatch above).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: resolve ci-ok's conclusion for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 40 x 30s = 20 minutes. Sized well above observed CI on this repo (main runs settle in
          # ~1-2 min; the v0.7.47 release commit took 47s from publish start to ci-ok appearing),
          # with headroom for a cold-cache or CodeQL-heavy run. The loop exits the moment CI is
          # green, so a generous ceiling costs nothing on the common path — it only bounds the
          # pathological one.
          ATTEMPTS=40
          INTERVAL=30

          echo "resolving every 'ci-ok' check run for $SHA"
          # `--paginate` because a commit can carry more check runs than one page holds; without it
          # a green ci-ok on page 2 would read as absent and refuse a legitimate release.
          #
          # EVERY ci-ok conclusion must be success, not just the first one the API happens to list.
          # `ci.yml` triggers on BOTH `push:` and `pull_request:`, so a tagged commit that was also a
          # PR head carries TWO ci-ok check runs — one per event's check suite. The API's implicit
          # `filter=latest` dedupes re-runs WITHIN a suite, not ACROSS suites. Taking `head -1` there
          # would let a green run mask a red one, which is precisely the "treat ambiguity as fine"
          # reasoning this job exists to refuse.
          #
          # `.conclusion // "pending"` because a check run STILL IN PROGRESS has `conclusion: null`,
          # and gh's --jq renders null as an EMPTY LINE. A trailing empty line is stripped by `$(...)`,
          # so an unfinished ci-ok listed last would vanish and the gate would pass mid-run. Mapping
          # it to a concrete token makes it fail the success comparison like any other non-success.
          STATE="not registered yet"
          for attempt in $(seq 1 "$ATTEMPTS"); do
            # A failed API call is NOT treated as "absent" — conflating an outage with a verdict is
            # the same category error as conflating "not failed" with "passed". It keeps waiting and,
            # if it never recovers, times out into a refusal with an accurate reason.
            if ! CONCLUSIONS="$(gh api --paginate \
              "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "ci-ok") | (.conclusion // "pending")')"; then
              CONCLUSIONS=""
              STATE="the check-runs API call failed"
            elif [ -z "$CONCLUSIONS" ]; then
              STATE="not registered yet"
            fi

            if [ -n "$CONCLUSIONS" ]; then
              # Settled and not success — final. Refuse now rather than waiting out the ceiling on a
              # verdict that is already in.
              BAD="$(echo "$CONCLUSIONS" | grep -vx 'success' | grep -vx 'pending' || true)"
              if [ -n "$BAD" ]; then
                echo "ci-ok conclusions for $SHA:"
                echo "$CONCLUSIONS" | sed 's/^/  - /'
                echo "::error::At least one 'ci-ok' check run for $SHA is not success:"
                echo "$BAD" | sed 's/^/::error::  - /'
                echo "::error::Refusing to publish. One green run does not cancel a red one — a commit can"
                echo "::error::carry a ci-ok per check suite (push and pull_request), and ALL must pass."
                exit 1
              fi

              if ! echo "$CONCLUSIONS" | grep -qx 'pending'; then
                echo "ci-ok conclusions for $SHA:"
                echo "$CONCLUSIONS" | sed 's/^/  - /'
                echo "CI is green for $SHA ($(echo "$CONCLUSIONS" | wc -l | tr -d ' ') ci-ok run(s), all success)."
                exit 0
              fi
              STATE="still running"
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "attempt $attempt/$ATTEMPTS: ci-ok $STATE for $SHA; waiting ${INTERVAL}s"
              sleep "$INTERVAL"
            fi
          done

          echo "::error::Timed out after $(( ATTEMPTS * INTERVAL ))s waiting for 'ci-ok' on $SHA."
          echo "::error::Last seen: $STATE."
          echo "::error::Refusing to publish. A timeout is a REFUSAL, not a pass — running out of"
          echo "::error::patience is not evidence that CI succeeded, and treating it as such is the"
          echo "::error::same reasoning that shipped 0.7.17."
          exit 1

  version-check:
    name: tag matches the in-tree versions
    # Tag-triggered only: a manual run has no vX.Y.Z ref to check (see workflow_dispatch above).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the ancestry assertion below needs real history. A shallow clone has no
      # merge base to test against and would fail every tag spuriously.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: assert vTAG == ts/package.json == python version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TS=$(node -p "require('./ts/package.json').version")
          PY=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  ts=$TS  py=$PY"
          if [ "$TAG" != "$TS" ] || [ "$TAG" != "$PY" ]; then
            echo "::error::tag v$TAG does not match ts ($TS) / python ($PY) — bump the versions and re-tag."
            exit 1
          fi
      # A tag is not branch-scoped, and `ci.yml` runs on EVERY branch push — so `ci-green` can
      # legitimately resolve a green `ci-ok` for a commit that only ever lived on a feature branch.
      # Nothing else in this workflow asserts the commit reached `main`: `version-check` compares the
      # tag to in-tree strings, and `ci-green` reads check runs. Without this, tagging a green
      # unmerged commit publishes it.
      - name: assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          # NOT --depth=0 (git rejects it: "depth 0 is not a positive number"). The
          # checkout above already sets fetch-depth: 0, so the clone is complete and a
          # plain fetch is all origin/main needs to exist as a ref here.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — refusing to publish a commit that never merged. Merge it first, then tag the merged commit."
            exit 1
          fi
          echo "$GITHUB_SHA is on origin/main — OK"

  npm:
    name: npm → Cloudsmith
    if: github.event_name == 'push'
    needs: [version-check, ci-green]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.cloudsmith.io/zer07labs/internal/"
          scope: "@zer07labs"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login + generate the transport stubs from the BSR
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "::error::BUF_TOKEN is not set — cannot generate the transport stubs; the wheel/tarball would ship without a transport."
            exit 1
          fi
          printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
          # `make generate`, never raw `buf generate` — see the python job below for what raw
          # output costs. This job only ships TypeScript, but the two must not diverge: a reader
          # comparing them should not have to work out which one is deliberate.
          make generate
      - name: build + publish
        working-directory: ts
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
        run: |
          # Prefer a dedicated CLOUDSMITH_API_KEY; else reuse the ORG-level Cargo token — the same Cloudsmith
          # key, just stored with the cargo:token provider's literal "Bearer " prefix, which npm's _authToken
          # must NOT carry (npm adds its own). Strip it.
          TOKEN="$CLOUDSMITH_API_KEY"
          [ -z "$TOKEN" ] && TOKEN="${CARGO_REGISTRIES_ZER07LABS_TOKEN#Bearer }"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudsmith credential. Set CLOUDSMITH_API_KEY, or ensure the org secret CARGO_REGISTRIES_ZER07LABS_TOKEN is in scope for this repo (with npm push to zer07labs/internal)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          export NODE_AUTH_TOKEN="$TOKEN"   # setup-node wrote _authToken=${NODE_AUTH_TOKEN} into .npmrc
          npm ci
          npm run build

          # ── G1: PACK THE TARBALL, INSTALL IT, IMPORT IT — before publishing. ──────────────────
          # This job used to be `npm ci && npm run build && npm publish` with nothing in between.
          # The Python job has installed and imported its wheel since 0.7.16; npm had no equivalent
          # at all, so a TypeScript packaging defect of the 0.7.13 shape (files present, package
          # unusable) would ship undetected.
          #
          # OUTSIDE the repo, for the same reason the Python gate uses a fresh venv: this directory
          # has src/ and node_modules/ on the resolution path, so an import here would succeed no
          # matter what the tarball contains. /tmp/packcheck resolves only what was packed.
          TARBALL="$(npm pack --silent --pack-destination /tmp)"
          echo "packed /tmp/$TARBALL"
          mkdir -p /tmp/packcheck && cd /tmp/packcheck
          npm init -y >/dev/null
          npm install --silent "/tmp/$TARBALL"
          VECTORS="$GITHUB_WORKSPACE/conformance/vectors.json" node --input-type=module - <<'JS'
          import { Agent, buildPresentation, collectiveOutcomeOf } from "@zer07labs/seam-sdk";
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";

          // Exercise the package, not just its module graph. The 0.7.13 lesson is that a package
          // whose files are ALL PRESENT can still be unusable, so a presence check proves nothing —
          // only running something real does.
          assert.equal(typeof buildPresentation, "function", "buildPresentation missing from the published entry point");
          assert.equal(typeof collectiveOutcomeOf, "function", "collectiveOutcomeOf missing from the published entry point");

          const { inputs, derived, presentation } = JSON.parse(readFileSync(process.env.VECTORS, "utf8")).admission;
          const seed = Uint8Array.from(Buffer.from(inputs.agent_seed_hex, "hex"));

          // Two real crypto operations against the COMMITTED conformance vector, not a self-check:
          // the AID derivation, and the byte-exact pinned-key presentation. Both are generated by
          // executing the runtime's Rust, so agreement here means agreement with the reference —
          // which is precisely what 0.7.17's tests could not establish, because they verified a
          // payload they rebuilt themselves.
          assert.equal(new Agent(seed).aid, derived.sender_aid, "AID derivation disagrees with the conformance vector");
          assert.deepEqual(
            buildPresentation(seed, inputs.receiver_aid, inputs.pop_nonce, inputs.now_ms),
            presentation,
            "the published package builds a presentation that differs from the conformance vector",
          );
          console.log("tarball installs, imports, and reproduces the conformance vectors — OK");
          JS
          cd "$GITHUB_WORKSPACE/ts"

          npm publish   # registry + access come from package.json publishConfig

  python:
    name: python wheel → Cloudsmith
    if: github.event_name == 'push'
    needs: [version-check, ci-green]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf login + generate the transport stubs from the BSR
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "::error::BUF_TOKEN is not set — cannot generate the transport stubs."
            exit 1
          fi
          printf '%s' "$BUF_TOKEN" | buf registry login buf.build --token-stdin
          # `make generate`, NOT raw `buf generate`. This line shipped `buf generate` and every
          # wheel it produced was UNIMPORTABLE:
          #
          #     File ".../seam_sdk/_gen/seam/api/v1/seam_pb2.py", line 25
          #       from seam.event.v1 import seam_event_pb2 as ...
          #     ModuleNotFoundError: No module named 'seam'
          #
          # protoc emits top-level `from seam.<pkg>.v1 import` for its siblings;
          # `scripts/root_gen.py` rewrites those to the rooted `seam_sdk._gen.*` form and drops
          # the `__init__.py` files. `make generate` runs both. ci.yml has said so in a comment
          # three times over; this file did the other thing, and the guard below could not see
          # the difference because it only looked for the file, never imported it.
          make generate
      # ── The 0.7.43 guard. ──────────────────────────────────────────────────────────────────────
      # `ci.yml` derives the dependency floors from the stubs IT generated. This job just generated
      # them AGAIN, minutes-to-hours later, against buf's *unpinned* remote plugins
      # (`buf.gen.yaml:29,31,33` are bare `remote:` refs that track latest). Nothing between those
      # two generations pins the gencode, so a plugin roll in the gap ships a wheel whose declared
      # floor is lower than the gencode it bundles — and protobuf's runtime-version check rejects a
      # runtime OLDER than the gencode that produced a file.
      #
      # That is not hypothetical: v0.7.43 shipped `protobuf>=7.35.1,<8` over 7.36.0 gencode. The
      # `ci-green` job added in #51 closes the path THAT release took (a red CI at the tagged
      # commit); it does not close this one, because CI was green and the skew happened afterwards.
      # Today the floor and the gencode are EQUAL (`>=7.36.0` vs 7.36.0), so there is zero headroom:
      # the very next plugin bump reproduces it.
      #
      # These two assertions are pure file reads (`test_protobuf_floor.py` imports only pathlib/re/
      # pytest), so they need no install beyond pytest and cannot be skipped here — `_gen` was just
      # written by the step above, and the tests only self-skip when it is absent.
      #
      # grpcio is mirrored for the same reason and needs `grpcio` installed, because
      # `test_grpcio_floor.py` imports `grpc` at module scope. Its floor is derived from the CALLING
      # CONVENTIONS the grpc plugin emitted (`_registered_method=`, `add_registered_method_handlers`),
      # so a plugin roll can require a newer grpcio than the wheel declares — the same defect wearing
      # a different dependency. That derivation is `max()` over a hardcoded two-entry `_MARKERS`
      # list, which used to be selected here alone: a THIRD convention appearing alongside the first
      # two would move the derivation not at all, so the floor would understate what the stubs
      # actually need while this step stayed green. The recognizer test (`test_grpcio_floor.py:93`)
      # exists for exactly that case — it fires when NONE of the known markers match — and the `-k`
      # below now selects it alongside the derivation, so an unrecognised convention is a
      # publish-time refusal rather than a `max()` with nothing left to measure.
      #
      # Recognising the convention is still only half the guard, the same way this file's protobuf
      # checks were only half of the 0.7.43 fix on their own: the "build" step below installs the
      # wheel with `grpcio==$GRPCIO_FLOOR` pinned alongside `protobuf==$FLOOR` and then constructs a
      # client stub AND registers a servicer under that exact pin, because the client and server
      # calling conventions split across grpcio 1.63 and 1.64 — a mismatch surfaces at stub
      # construction or servicer registration, not at import, so nothing short of exercising both
      # would have caught it.
      - name: re-derive the dependency floors from the JUST-generated stubs
        run: |
          # Explicit, NOT relying on the runner's default `bash -e {0}`. Without it the step's
          # status is its LAST command's, so a red protobuf-floor test followed by a green
          # grpcio one exits 0 and publishes the defect this step exists to catch. That is not
          # hypothetical — it is what the first draft of this step did.
          set -euo pipefail
          # ASSERT the stubs are where the guards look, do not assume it. `test_protobuf_floor.py`
          # SKIPS when `_gen/seam/api/v1/seam_pb2.py` is absent, and pytest exits 0 when every
          # selected test skips — so a `make generate` that succeeds while writing the tree
          # somewhere else leaves this step green having checked nothing. That is not an invented
          # risk: writing `_gen` without rooting the imports is the exact defect this job shipped
          # when it ran raw `buf generate`, and "green because it never ran" is the failure shape
          # this whole step exists to remove.
          test -f python/seam_sdk/_gen/seam/api/v1/seam_pb2.py || { echo "::error::the generated tree is not at python/seam_sdk/_gen — the floor guards would SKIP, and a skip exits 0. Refusing to publish a wheel whose dependency floors were never actually measured."; exit 1; }
          python -m pip install --quiet pytest grpcio
          python -m pytest python/tests/test_protobuf_floor.py -q \
            -k "declared_floor_is_at_least or caps_the_major"
          python -m pytest python/tests/test_grpcio_floor.py -q \
            -k "covers_every_convention or guard_recognises"
      - name: build (bundles the transport via package-data) + upload
        working-directory: python
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
          # Cloudsmith twine auth: username `token`, password = the raw API key.
          TWINE_USERNAME: token
          TWINE_REPOSITORY_URL: "https://python.cloudsmith.io/zer07labs/internal/"
        run: |
          # Dedicated key if set, else the org Cargo token with its "Bearer " prefix stripped (see the npm job).
          TOKEN="$CLOUDSMITH_API_KEY"
          [ -z "$TOKEN" ] && TOKEN="${CARGO_REGISTRIES_ZER07LABS_TOKEN#Bearer }"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudsmith credential. Set CLOUDSMITH_API_KEY, or ensure the org secret CARGO_REGISTRIES_ZER07LABS_TOKEN is in scope for this repo (with python push to zer07labs/internal)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          export TWINE_PASSWORD="$TOKEN"
          python -m pip install --quiet build twine
          python -m build
          # INSTALL THE WHEEL AND IMPORT IT. The previous guard listed the zip's contents and
          # checked that `_gen/seam/api/v1/seam_pb2.py` was present — then printed "refusing to
          # publish a broken wheel". It could not have detected the break it was named for: the
          # file was always there, and always unimportable, because the step above generated it
          # without rooting the imports. A guard that cannot fail for the reason it claims is
          # worse than no guard, because it is also a promise.
          #
          # A fresh venv, not this one: the build environment has the source tree on sys.path,
          # so `import seam_sdk` here would resolve `python/seam_sdk/` and pass no matter what
          # the wheel contains.
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheelcheck/bin/python - <<'PY'
          import seam_sdk
          # The generated transport is behind these two imports; a raw-buf wheel dies on the
          # first one with ModuleNotFoundError: No module named 'seam'.
          from seam_sdk import SeamClient, aio  # noqa: F401
          from seam_sdk._gen.seam.api.v1 import seam_pb2  # noqa: F401
          # And a real key derivation, so the check exercises the package rather than its imports.
          assert seam_sdk.Agent(bytes(32)).aid.startswith("aid:pubkey:ed25519:")
          print("wheel installs, imports, and derives — OK")
          PY
          # ── The same wheel, at the MINIMUM protobuf AND grpcio it claims to support. ─────────────
          # The check above installs unconstrained, so pip resolves the NEWEST protobuf and grpcio —
          # which by construction satisfy whatever gencode/convention the wheel bundles. That is why
          # it could never have caught 0.7.43, and why `registry-smoke` cannot either: both answer
          # "does this work with the newest?", and the defect only appears at the floor.
          #
          # This answers the question whose absence IS the 0.7.43 story: is the metadata TRUE? A
          # consumer whose closure caps protobuf AND grpcio at our declared floors gets exactly this
          # resolution, and it must not just import but actually WORK. Floors are parsed from the
          # wheel's own pyproject rather than hardcoded — hardcoding would drift the moment either
          # derived floor moves, which it does.
          cd "$GITHUB_WORKSPACE/python"
          FLOOR=$(grep -oE '"protobuf>=[0-9]+\.[0-9]+\.[0-9]+,<[0-9]+"' pyproject.toml \
                  | head -1 | sed -E 's/.*>=([0-9.]+),.*/\1/')
          if [ -z "$FLOOR" ]; then
            echo "::error::could not parse the declared protobuf floor from python/pyproject.toml — refusing to publish a wheel whose metadata cannot be checked."
            exit 1
          fi
          # grpcio's declared floor has no upper-bound cap (`"grpcio>=1.64"`, not the `>=X,<Y` shape
          # protobuf carries), so it needs its own pattern — same PARSING SHAPE as FLOOR above (grep
          # the declaration, sed out the number), not a second style of doing it.
          GRPCIO_FLOOR=$(grep -oE '"grpcio>=[0-9]+\.[0-9]+(\.[0-9]+)?"' pyproject.toml \
                  | head -1 | sed -E 's/.*>=([0-9.]+)"/\1/')
          if [ -z "$GRPCIO_FLOOR" ]; then
            echo "::error::could not parse the declared grpcio floor from python/pyproject.toml — refusing to publish a wheel whose metadata cannot be checked."
            exit 1
          fi
          echo "declared protobuf floor: $FLOOR, grpcio floor: $GRPCIO_FLOOR — installing the wheel pinned at both"
          python -m venv /tmp/floorcheck
          # No fallback to an unconstrained install if either pin is unavailable. A silent fallback
          # would recreate exactly the blind spot this step exists to remove — for grpcio
          # specifically, resolving to newer-than-floor here would leave a consumer who genuinely
          # DOES land on the floor to discover the AttributeError themselves, in their own process.
          if ! /tmp/floorcheck/bin/python -m pip install --quiet "protobuf==$FLOOR" "grpcio==$GRPCIO_FLOOR" dist/*.whl; then
            echo "::error::the wheel does not install with protobuf and grpcio pinned at their own declared floors (protobuf==$FLOOR, grpcio==$GRPCIO_FLOOR). Either a floor is stale (re-derive it) or one of the pinned versions has no wheel for this runner's Python — do not publish metadata that is not true."
            exit 1
          fi
          cd /tmp && GRPCIO_FLOOR="$GRPCIO_FLOOR" /tmp/floorcheck/bin/python - <<'PY'
          import importlib.metadata
          import os

          import google.protobuf
          import seam_sdk
          # seam_pb2 is where the runtime-version check fires: protoc writes a
          # ValidateProtobufRuntimeVersion call into the generated module's preamble, and it raises
          # if the INSTALLED runtime is older than the gencode. Importing it under the pinned floor
          # is the whole assertion — 0.7.43 would have died on exactly this line.
          from seam_sdk._gen.seam.api.v1 import seam_pb2  # noqa: F401
          from seam_sdk import SeamClient, aio  # noqa: F401
          assert seam_sdk.Agent(bytes(32)).aid.startswith("aid:pubkey:ed25519:")
          print(f"wheel imports at its declared floor — protobuf {google.protobuf.__version__} — OK")

          # "Some grpcio" is not the assertion. PEP 440 zero-pads a short release segment for
          # comparison (`==1.64` only matches `1.64.0`), so the pin above is already exact — this
          # reads the venv's own installed-distribution metadata back to PROVE it, the way a
          # consumer's own resolver would be asked to, rather than trusting the pip exit code alone.
          declared_grpcio = tuple(int(p) for p in os.environ["GRPCIO_FLOOR"].split("."))
          installed_grpcio = importlib.metadata.version("grpcio")
          got_grpcio = tuple(int(p) for p in installed_grpcio.split("."))[: len(declared_grpcio)]
          assert got_grpcio == declared_grpcio, (
              f"pip resolved grpcio {installed_grpcio}, not the declared floor "
              f"{os.environ['GRPCIO_FLOOR']} — the venv is not provably AT the floor"
          )
          print(f"wheel installs with grpcio AT its declared floor — {installed_grpcio} — OK")

          # Behavioural, not just present: the client and server calling conventions split across
          # grpcio 1.63 and 1.64, and a mismatch surfaces at stub CONSTRUCTION and at SERVICER
          # REGISTRATION, not at import (test_grpcio_floor.py:133,147) — an import-only check here
          # would have passed the client half of this exact split and missed the server half
          # entirely. A dead/local address only: this must never attempt a real connection.
          import concurrent.futures as futures

          import grpc

          from seam_sdk._gen.seam.api.v1 import seam_pb2_grpc as rpc

          channel = grpc.insecure_channel("127.0.0.1:1")
          try:
              rpc.SeamAdmissionStub(channel)
              rpc.SeamAuthorizationStub(channel)
          finally:
              channel.close()

          server = grpc.server(futures.ThreadPoolExecutor(max_workers=1))
          try:
              rpc.add_SeamAdmissionServicer_to_server(rpc.SeamAdmissionServicer(), server)
              rpc.add_SeamAuthorizationServicer_to_server(rpc.SeamAuthorizationServicer(), server)
          finally:
              server.stop(None)
          print(
              "wheel constructs a client stub and registers a server at its declared grpcio "
              f"floor — {installed_grpcio} — OK"
          )
          PY
          cd "$GITHUB_WORKSPACE/python"
          twine upload dist/*

  # ── The verifier crate → Cloudsmith (the org's private Cargo registry) ─────────────────────────
  # NOT crates.io. Binaries and packages for this org live on Cloudsmith, and `verify/Cargo.toml`
  # encodes that as `publish = ["zer07labs"]` — an allow-list, so an accidental `cargo publish` to
  # the public index is a cargo error rather than an irreversible namespace claim.
  #
  # WHAT PUBLISHING HERE DOES AND DOES NOT BUY, stated so nobody later overstates it: Cloudsmith
  # `internal` is PRIVATE, so an external auditor cannot install from it. Their path is, and always
  # was, "clone the public Apache-2.0 repo and build it" — `verify/` is a standalone workspace with
  # zero Seam dependencies precisely so that works anywhere. This job is distribution convenience
  # for internal and partner consumers, not what makes the verifier independently obtainable.
  #
  # `workflow_dispatch` only: a verifier release is not something a runtime version bump should drag
  # out, and the version here is deliberately independent of the SDK's (see DECISIONS.md).
  publish-verify:
    name: seam-verify → Cloudsmith
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Job-level, because the dry-run needs it too (see the step comment below). Cloudsmith's
      # cargo:token provider expects a literal "Bearer " prefix on the value.
      CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # THE INDEPENDENCE PROOF IS THE PRODUCT, so it gates the publish rather than merely running
      # beside it. Same assertion as ci.yml's `verify` job, repeated here on purpose: a publish that
      # skipped it could ship a verifier that links Seam's own crates, which inverts the only claim
      # the crate makes.
      # The check itself lives in one script (`scripts/check-independence.sh`), also called from
      # ci.yml's `verify` job, so the two copies cannot drift — see that script's header for why it
      # is a denylist rather than the allowlist this replaced. Job `defaults.run.working-directory`
      # is `verify` here, so the script is reached via `..`.
      - name: the verifier must link NOTHING of Seam's
        run: ../scripts/check-independence.sh

      # Re-verify the shipped fixture before publishing it. The crate's credibility rests on a third
      # party being able to check a real signature with it; shipping a fixture that no longer
      # verifies would be worse than shipping none.
      - name: the shipped fixtures must still verify
        run: cargo test --locked

      # BOTH the dry-run and the publish need the registry token. `publish = ["zer07labs"]` makes
      # even the DRY RUN resolve the private sparse index, so a token-less dry-run dies with
      # "no token found for `zer07labs`" — every dispatch would fail before reaching the publish.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      - name: publish to Cloudsmith
        run: |
          if [ -z "${CARGO_REGISTRIES_ZER07LABS_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRIES_ZER07LABS_TOKEN is not set — cannot publish to Cloudsmith."
            exit 1
          fi
          # `publish = ["zer07labs"]` in Cargo.toml makes the registry implicit; naming it anyway so
          # the log records where this went.
          cargo publish --locked --registry zer07labs

  # ── G2: install what was actually PUBLISHED, from the registry ─────────────────────────────────
  # Everything above proves the ARTIFACT. Nothing proved the PUBLICATION: no workflow in this repo
  # has ever installed seam-sdk from Cloudsmith. The only thing that ever has is seam-adapters'
  # live-wire job, in another repo, by accident of being a consumer.
  #
  # Note this DETECTS, it does not PREVENT — it runs after upload, and a published version is
  # immutable per registry, so a failure here means "advertise the floor and cut a fix", not
  # "roll back". The preventive gates are ci-green (G3) and the pack/wheel install gates (G1).
  # Stating that plainly so a later reader does not mistake this job for a safety net it is not.
  #
  # The install host is DIFFERENT from the upload host — dl.cloudsmith.io vs
  # python.cloudsmith.io / npm.cloudsmith.io (README.md:158-161). Resolving through the download
  # host is the whole point: it is the path a consumer actually takes.
  registry-smoke:
    name: install from Cloudsmith and run the vectors
    if: github.event_name == 'push'
    needs: [npm, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install the PUBLISHED wheel from dl.cloudsmith.io and run the conformance vectors
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$CLOUDSMITH_API_KEY"
          [ -z "$TOKEN" ] && TOKEN="${CARGO_REGISTRIES_ZER07LABS_TOKEN#Bearer }"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudsmith credential — cannot install from the registry."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          VER="${GITHUB_REF_NAME#v}"
          INDEX="https://token:${TOKEN}@dl.cloudsmith.io/basic/zer07labs/internal/python/simple/"

          python -m venv /tmp/registrycheck
          # `--dry-run --report` (the provenance check below) needs pip >= 22.2. Upgrading rather
          # than assuming the runner's bundled version, so the check cannot silently degrade into
          # "the flag was unrecognised" on an older image.
          /tmp/registrycheck/bin/pip install --quiet --upgrade pip
          # Cloudsmith indexes asynchronously, so a just-uploaded version is briefly absent. Bounded
          # retry with a HARD ceiling — a timeout FAILS the job. "Probably fine, it'll appear" is the
          # reasoning this whole workstream exists to remove.
          ok=0
          for attempt in $(seq 1 10); do
            if /tmp/registrycheck/bin/pip install --quiet \
                 --index-url "https://pypi.org/simple/" \
                 --extra-index-url "$INDEX" \
                 "seam-sdk==$VER"; then
              ok=1; break
            fi
            echo "attempt $attempt: seam-sdk==$VER not resolvable yet; waiting 30s"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::seam-sdk==$VER never became installable from dl.cloudsmith.io within 5 minutes."
            echo "::error::The upload reported success, so the artifact exists but the PUBLICATION is not"
            echo "::error::usable. Do not treat this as flaky — check Cloudsmith before announcing the release."
            exit 1
          fi

          # Prove the artifact actually CAME FROM Cloudsmith — from the resolved download URL, not
          # from pip's chatter.
          #
          # The obvious version of this check is vacuous and was caught in review: grepping
          # `pip download -v` output for `dl.cloudsmith.io` matches pip's own
          # "Looking in indexes: ..." preamble, which it prints regardless of where the file was
          # actually fetched. With pypi.org as --index-url, a `seam-sdk` of the same version
          # published to PUBLIC PyPI — the dependency-confusion shape — would install from pypi.org
          # and still satisfy that grep. A provenance check that passes on the wrong artifact is
          # worse than none.
          #
          # `--report` gives the resolver's own answer: download_info.url is where the file came from.
          # `--ignore-installed` is REQUIRED, not defensive: the retry loop above really installed
          # seam-sdk into this venv, and `--dry-run --report` reports only what WOULD be installed —
          # an already-satisfied requirement yields `"install": []`. Without this the check fails on
          # every legitimate release, which is worse than the vacuous grep it replaced: a gate that
          # always fails gets read as flakiness and then weakened.
          /tmp/registrycheck/bin/pip install --dry-run --no-deps --quiet --ignore-installed \
            --report /tmp/resolve.json \
            --index-url "https://pypi.org/simple/" \
            --extra-index-url "$INDEX" "seam-sdk==$VER"
          python3 - <<'RESOLVE'
          import json, sys, urllib.parse
          report = json.load(open("/tmp/resolve.json"))
          for item in report.get("install", []):
              name = item["metadata"]["name"]
              url = item.get("download_info", {}).get("url", "")
              host = urllib.parse.urlparse(url).netloc.split("@")[-1]
              if name.replace("_", "-").lower() != "seam-sdk":
                  continue
              print(f"seam-sdk resolved from: {host}")
              # Exact host, not a suffix: `endswith("cloudsmith.io")` would also accept
              # `notcloudsmith.io`. A provenance check whose own comment claims rigor should not
              # have a hole that cheap.
              if host != "dl.cloudsmith.io":
                  print(f"::error::seam-sdk was resolved from {host!r}, not dl.cloudsmith.io.")
                  print("::error::A same-named package on a public index would satisfy a weaker check;")
                  print("::error::this one reads the resolver's own download_info.url. Refusing.")
                  sys.exit(1)
              break
          else:
              print("::error::seam-sdk does not appear in the resolve report at all")
              sys.exit(1)
          RESOLVE

          cd /tmp && /tmp/registrycheck/bin/python - "$GITHUB_WORKSPACE/conformance/vectors.json" <<'PY'
          import json, sys
          import seam_sdk
          from seam_sdk import Agent, build_presentation

          admission = json.load(open(sys.argv[1]))["admission"]
          seed = bytes.fromhex(admission["inputs"]["agent_seed_hex"])

          assert Agent(seed).aid == admission["derived"]["sender_aid"], "AID disagrees with the vector"
          assert build_presentation(
              seed,
              admission["inputs"]["receiver_aid"],
              admission["inputs"]["pop_nonce"],
              admission["inputs"]["now_ms"],
          ) == admission["presentation"], "presentation disagrees with the vector"
          print(f"published seam-sdk {seam_sdk.__version__ if hasattr(seam_sdk, '__version__') else ''} reproduces the conformance vectors — OK")
          PY
      - name: install the PUBLISHED npm package from Cloudsmith and run the vectors
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CARGO_REGISTRIES_ZER07LABS_TOKEN: ${{ secrets.CARGO_REGISTRIES_ZER07LABS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$CLOUDSMITH_API_KEY"
          [ -z "$TOKEN" ] && TOKEN="${CARGO_REGISTRIES_ZER07LABS_TOKEN#Bearer }"
          echo "::add-mask::$TOKEN"
          VER="${GITHUB_REF_NAME#v}"

          mkdir -p /tmp/npmsmoke && cd /tmp/npmsmoke && npm init -y >/dev/null
          cat > .npmrc <<NPMRC
          @zer07labs:registry=https://npm.cloudsmith.io/zer07labs/internal/
          //npm.cloudsmith.io/zer07labs/internal/:_authToken=${TOKEN}
          NPMRC
          ok=0
          for attempt in $(seq 1 10); do
            if npm install --silent "@zer07labs/seam-sdk@$VER"; then ok=1; break; fi
            echo "attempt $attempt: @zer07labs/seam-sdk@$VER not resolvable yet; waiting 30s"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::@zer07labs/seam-sdk@$VER never became installable from Cloudsmith within 5 minutes."
            exit 1
          fi

          VECTORS="$GITHUB_WORKSPACE/conformance/vectors.json" node --input-type=module - <<'JS'
          import { Agent, buildPresentation } from "@zer07labs/seam-sdk";
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";

          const { inputs, derived, presentation } = JSON.parse(readFileSync(process.env.VECTORS, "utf8")).admission;
          const seed = Uint8Array.from(Buffer.from(inputs.agent_seed_hex, "hex"));
          assert.equal(new Agent(seed).aid, derived.sender_aid, "AID disagrees with the vector");
          assert.deepEqual(
            buildPresentation(seed, inputs.receiver_aid, inputs.pop_nonce, inputs.now_ms),
            presentation,
            "presentation disagrees with the vector",
          );
          console.log("published @zer07labs/seam-sdk reproduces the conformance vectors — OK");
          JS

  # ── A refused release told nobody ──────────────────────────────────────────────────────────────
  # Every job above this one is a gate, and all of them work. v0.7.69, v0.7.70 and v0.7.72 were each
  # refused correctly — and each refusal was discovered days later, by hand, because a failed
  # workflow run is a red dot on a page nobody opens. The registry sat five days behind the source
  # with the tag, the wheel version and the runtime all claiming 0.7.72 existed.
  #
  # So this job exists to make a refusal ARRIVE somewhere. It is not another gate: it cannot block
  # anything, it has no opinion on whether refusing was right, and it must never turn a red release
  # green. It reports.
  #
  # `if: always()` is the whole point. The default is "run only if `needs` succeeded", which would
  # make the notifier silent in exactly the case it was written for — the shape of bug this
  # workstream keeps finding.
  #
  # NOTE the blind spot this job structurally cannot cover: it is a job INSIDE publish.yml, so it
  # reports a publish that ran and failed. A publish that never ran at all — no tag pushed, trigger
  # misconfigured, workflow file broken — fails silently exactly as before, because nothing
  # executes. That case needs a check that runs on its own schedule and compares the registry to
  # the source; it is deliberately NOT solved here (see the issue this job cites).
  release-outcome:
    name: report a release that did not publish
    if: always() && github.event_name == 'push'
    needs: [ci-green, version-check, npm, python, registry-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GREEN: ${{ needs.ci-green.result }}
          VERSION_CHECK: ${{ needs.version-check.result }}
          NPM: ${{ needs.npm.result }}
          PYTHON: ${{ needs.python.result }}
          SMOKE: ${{ needs.registry-smoke.result }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          TITLE="Release ${TAG} did not publish"

          # `registry-smoke` is the ONLY job whose success proves the release landed: it installs the
          # published artifact back OUT of Cloudsmith and runs the conformance vectors against it.
          # Reading anything weaker — "npm and python both succeeded" — cannot tell a finished
          # release from one that uploaded and never became installable, which is a failure this
          # repo has already seen and which registry-smoke was added to catch.
          if [ "$SMOKE" = "success" ]; then
            echo "$TAG published and verified — nothing to report"
            exit 0
          fi

          BODY="$(mktemp)"
          {
            printf '`%s` was tagged, but the release did not complete.\n\n' "$TAG"
            printf '| job | result |\n|---|---|\n'
            printf '| ci-green | %s |\n' "$CI_GREEN"
            printf '| version-check | %s |\n' "$VERSION_CHECK"
            printf '| npm | %s |\n' "$NPM"
            printf '| python | %s |\n' "$PYTHON"
            printf '| registry-smoke | %s |\n' "$SMOKE"
            printf '\n%s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\nThe registry still serves the previous version, so nothing downstream breaks.\n'
            printf 'What breaks is the assumption that a tag means a release: the tag, the in-tree\n'
            printf 'version and the registry now disagree, and they stay that way until someone acts.\n'
            printf '\nA refusal here is usually CORRECT — the gates above caught something. Decide\n'
            printf 'whether to fix forward and re-tag, or to leave the version permanently unpublished.\n'
          } > "$BODY"

          # One issue per tag: a re-run of a failing release comments rather than opening a second.
          # gh output goes to a file rather than through a pipe — `set -o pipefail` plus a reader
          # that exits early turns a SIGPIPE into a spurious job failure.
          LISTING="$(mktemp)"
          gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' > "$LISTING"
          EXISTING="$(awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }' "$LISTING")"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
            echo "release failure reported on existing #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
            echo "release failure reported as a new issue"
          fi
