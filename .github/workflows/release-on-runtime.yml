name: release (follow the runtime version)

# "One version everywhere": the seam-runtime release is the version AUTHORITY. When it cuts a release,
# its publish workflow fires a repository_dispatch here with the new version; this bumps ts/package.json +
# python/pyproject.toml to match, commits to main, and tags v{version} — which triggers publish.yml (the
# Cloudsmith npm + wheel upload). So the SDK is always the SAME version as the runtime.
#
# (This is where Seam deliberately diverges from MACP, whose repos version independently. Here the SDK
# FOLLOWS the runtime, which is what "one version everywhere" requires across two repos.)
#
# Uses the seam-deps-bot App token so the commit + tag it pushes actually trigger downstream CI + publish
# (GITHUB_TOKEN can't). Requires org secrets SEAM_BOT_APP_ID + SEAM_BOT_PRIVATE_KEY.
on:
  repository_dispatch:
    types: [seam-release]
  # Manual fallback: run it yourself with an explicit version if the dispatch is ever missed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.1), must match the runtime's"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the target version
        id: v
        run: |
          VER="${{ github.event.client_payload.version || github.event.inputs.version }}"
          VER="${VER#v}"   # tolerate a leading v
          [ -n "$VER" ] || { echo "::error::no version in the dispatch payload / input"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Mint the seam-deps-bot App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEAM_BOT_APP_ID }}
          private-key: ${{ secrets.SEAM_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      # ── W5.5: the framing handshake — the one gate that PREVENTS a 0.7.17 rather than
      #    detecting it ────────────────────────────────────────────────────────────────────────────
      # The SDK has no independent version by design, so a runtime wire change automatically
      # triggers an SDK release WHETHER OR NOT THE SDK HAS ADAPTED. That is the structural cause of
      # 0.7.17, which published eleven minutes after the runtime change that broke it. Every other
      # W5 gate makes that failure louder, after publication. This one stops the tag.
      #
      # Runs immediately after checkout and BEFORE anything is stamped, committed, or tagged, so a
      # refusal leaves no commit, no tag, and nothing published.
      #
      # It must stay AFTER actions/checkout: it reads contract/wire-framing.json out of the repo.
      # It originally sat before the token mint — which is also before checkout — so it never once
      # ran its comparison; it just crashed on a missing file and failed every release closed.
      # scripts/test_release_gate_order.sh asserts this ordering so the next reorder cannot
      # silently reintroduce it.
      - name: The runtime's wire framing must be one this SDK implements
        env:
          DISPATCHED: ${{ github.event.client_payload.wire_framing_version }}
        run: |
          set -euo pipefail
          SUPPORTED="$(python3 -c "import json;print(json.load(open('contract/wire-framing.json'))['supported'])")"
          LATCHED="$(python3 -c "import json;print(str(json.load(open('contract/wire-framing.json'))['runtime_emits_version']).lower())")"

          if [ -z "$DISPATCHED" ]; then
            if [ "$LATCHED" = "true" ]; then
              echo "::error::The release dispatch carried no wire_framing_version, but"
              echo "::error::contract/wire-framing.json has runtime_emits_version=true — meaning the runtime"
              echo "::error::is known to emit it. A field that stopped being emitted is a REGRESSION in the"
              echo "::error::handshake, not a reason to proceed. Refusing to tag."
              exit 1
            fi
            echo "::warning::No wire_framing_version in the dispatch payload. Allowed ONLY because"
            echo "::warning::contract/wire-framing.json has runtime_emits_version=false — the runtime has not"
            echo "::warning::adopted the handshake yet. Until it does, this gate cannot protect a release."
            echo "::warning::Tracking: $(python3 -c "import json;print(json.load(open('contract/wire-framing.json'))['runtime_adoption_issue'])")"
            exit 0
          fi

          echo "runtime wire framing: $DISPATCHED   SDK supports: $SUPPORTED"
          if [ "$DISPATCHED" != "$SUPPORTED" ]; then
            echo "::error::WIRE FRAMING MISMATCH — refusing to tag."
            echo "::error::  the runtime release carries framing v$DISPATCHED"
            echo "::error::  this SDK implements                v$SUPPORTED"
            echo "::error::"
            echo "::error::Releasing now would publish an SDK that signs the wrong bytes, under a version"
            echo "::error::number that says it matches the runtime. That is exactly what 0.7.17-0.7.19 did."
            echo "::error::"
            echo "::error::Adapt the shims (all five: go/, java/, kotlin/, python/, ts/ — plus verify/ if the"
            echo "::error::record digest moved), land the runtime-generated conformance vector for the new"
            echo "::error::framing, then bump 'supported' in contract/wire-framing.json in the same PR."
            exit 1
          fi
          echo "framing agrees — safe to tag."

      # The stamp lives in scripts/set_version.sh so it is testable without cutting a release —
      # scripts/test_set_version.sh runs on every PR. It was inline here, matching pyproject's
      # `version` key by LINE NUMBER, which would have half-stamped (ts yes, python no) the first
      # time anyone added a few comment lines above it.
      - name: Bump both packages to the runtime version
        run: ./scripts/set_version.sh "${{ steps.v.outputs.version }}"

      - name: Commit + tag (triggers publish.yml)
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "seam-deps-bot[bot]"
          git config user.email "seam-deps-bot[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "already at $VER — tagging only"
          else
            git commit -am "chore(release): v$VER — follow the runtime version"
            git push origin HEAD:main
          fi
          git tag -a "v$VER" -m "seam-sdk v$VER (follows seam-runtime)"
          # The Go module lives in go/ (module path github.com/zer07labs/seam-sdk/go), and Go resolves a
          # nested module's versions ONLY from `go/vX.Y.Z` tags — the root `v$VER` tag is invisible to
          # `go get`. Tag the SAME commit both ways so every release is fetchable in every language.
          git tag -a "go/v$VER" -m "seam-sdk Go module v$VER (follows seam-runtime)"
          git push origin "v$VER" "go/v$VER"
